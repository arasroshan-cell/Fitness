<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1117">
<title>Roshan — Fitness v1.2</title>
<style>
:root{--bg:#0F1117;--c1:#1C2233;--c2:#252D3D;--c3:#2D3748;--amb:#F5A623;--txt:#F1F5F9;--mut:#94A3B8;--dim:#64748B;--grn:#22C55E;--gbg:rgba(34,197,94,.13);--red:#EF4444;--rbg:rgba(239,68,68,.13);--abg:rgba(245,166,35,.13);--blu:#60A5FA;--ibg:rgba(96,165,250,.13)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding-bottom:24px}
.hdr{padding:18px 16px 12px;background:var(--bg);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--c3)}
.ey{font-size:10px;letter-spacing:2px;color:var(--amb);text-transform:uppercase;margin-bottom:3px}
.ht{font-size:21px;font-weight:700;line-height:1.2}
.hs{font-size:12px;color:var(--mut);margin-top:3px}
.mrow{display:flex;gap:8px;margin-top:10px}
.met{flex:1;background:var(--c1);border-radius:10px;padding:9px 6px;text-align:center}
.mv{font-size:15px;font-weight:700;color:var(--amb)}
.ml{font-size:9px;color:var(--mut);margin-top:2px}
.tabs{display:flex;background:var(--c1);border-bottom:1px solid var(--c3);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 14px;border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;border-bottom:2px solid transparent;flex-shrink:0}
.tab.on{color:var(--amb);border-bottom-color:var(--amb)}
.pnl{padding:14px;display:none}
.pnl.on{display:block}
.card{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.ct{font-size:15px;font-weight:600}
.cs{font-size:12px;color:var(--mut);margin-top:3px}
.sep{height:1px;background:var(--c3);margin:10px 0}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.pg{background:var(--gbg);color:var(--grn)}.pa{background:var(--abg);color:var(--amb)}.pr{background:var(--rbg);color:var(--red)}.pi{background:var(--ibg);color:var(--blu)}
.nt{border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;margin-top:10px;line-height:1.5}
.ng{background:var(--gbg);color:var(--grn)}.na{background:var(--abg);color:var(--amb)}.nr{background:var(--rbg);color:var(--red)}.ni{background:var(--ibg);color:var(--blu)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.exb{border-bottom:1px solid var(--c3);padding-bottom:14px;margin-bottom:14px}
.exb:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.exhd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.exn{font-size:14px;font-weight:600}
.exn.done{color:var(--grn)}
.subbed{font-size:10px;color:var(--amb);margin-top:1px}
.ext{font-size:11px;color:var(--mut);margin-top:2px}
.exlast{font-size:11px;color:var(--blu);text-align:right;flex-shrink:0;max-width:110px;line-height:1.4}
.exsugg{font-size:11px;color:var(--amb);text-align:right;margin-top:2px}
.srow{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--c3)}
.srow:last-child{border-bottom:none}
.snum{font-size:11px;color:var(--dim);width:18px;text-align:center;flex-shrink:0}
.nin{width:54px;padding:8px 5px;border:1px solid var(--c3);border-radius:8px;font-size:14px;background:var(--c2);color:var(--txt);font-family:inherit;text-align:center;-webkit-appearance:none}
.nin:focus{outline:none;border-color:var(--amb)}
.tx{font-size:12px;color:var(--dim)}
.dbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--c3);background:var(--c2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:var(--mut)}
.dbtn.dk{background:var(--gbg);border-color:var(--grn);color:var(--grn)}
.subbtn{font-size:11px;color:var(--mut);background:var(--c2);border:1px solid var(--c3);border-radius:6px;padding:5px 9px;cursor:pointer;font-family:inherit}
.subpanel{background:var(--c2);border-radius:10px;padding:10px;margin-top:8px}
.subopt{display:block;font-size:13px;color:var(--txt);padding:9px 10px;cursor:pointer;background:none;border:none;border-bottom:1px solid var(--c3);width:100%;text-align:left;font-family:inherit}
.subopt:last-child{border-bottom:none}
.subopt:active{background:var(--c3);border-radius:6px}
.genin{width:100%;padding:9px 10px;border:1px solid var(--c3);border-radius:8px;font-size:13px;background:var(--c1);color:var(--txt);font-family:inherit}
.genin::placeholder{color:var(--dim)}
.genin:focus{outline:none;border-color:var(--amb)}
textarea.genin{resize:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pstat{background:var(--c1);border-radius:12px;padding:12px;text-align:center}
.pval{font-size:22px;font-weight:700;color:var(--amb)}
.plbl{font-size:11px;color:var(--mut);margin-top:3px}
.prog-bar{background:var(--c2);border-radius:4px;height:5px;margin:4px 0}
.prog-fill{height:5px;border-radius:4px;transition:width .3s}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--c3);gap:8px}
.statrow:last-child{border-bottom:none}
.sinput{padding:7px;border:1px solid var(--c3);border-radius:8px;font-size:13px;background:var(--c2);color:var(--txt);font-family:inherit}
.sinput:focus{outline:none;border-color:var(--amb)}
.btn{padding:12px 16px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;margin-top:10px;display:block;text-align:center}
.btn-amb{background:var(--amb);color:#000}
.btn-ghost{background:var(--c2);color:var(--txt);border:1px solid var(--c3)}
.btn-red{background:var(--rbg);color:var(--red);border:1px solid var(--red)}
.btn-grn{background:var(--gbg);color:var(--grn);border:1px solid var(--grn)}
.btn-sm{padding:8px 12px;font-size:12px;margin-top:6px}
.btn:active{opacity:.85}
.confbox{background:var(--gbg);color:var(--grn);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;text-align:center;display:none;margin-top:10px}
.foodsel{width:100%;padding:10px;border:1px solid var(--c3);border-radius:10px;font-size:14px;background:var(--c2);color:var(--txt);font-family:inherit;margin-bottom:8px;-webkit-appearance:none}
.foodsel:focus{outline:none;border-color:var(--amb)}
.presult{background:var(--c2);border-radius:12px;padding:14px;margin-top:10px}
.macrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--c3);font-size:13px}
.macrow:last-child{border-bottom:none}
.macval{font-weight:600;color:var(--amb)}
.seg{display:flex;background:var(--c2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.segb{flex:1;padding:8px 6px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:var(--mut);font-family:inherit;white-space:nowrap}
.segb.on{background:var(--c1);color:var(--txt)}
.skipsheet{background:var(--c2);border-radius:14px;padding:14px;margin-top:10px;display:none}
.skipopt{display:block;width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--c3);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--c1);color:var(--txt);font-family:inherit;text-align:left}
.skipopt:last-child{margin-bottom:0}
.hitem{padding:8px 0;border-bottom:1px solid var(--c3)}
.hitem:last-child{border-bottom:none}
.mitem{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--c3);gap:8px}
.mitem:last-child{border-bottom:none}
.warn-banner{background:var(--rbg);color:var(--red);padding:10px 14px;font-size:12px;font-weight:600;text-align:center;display:none}
.water-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.water-count{font-size:22px;font-weight:700;color:var(--blu);margin:0 12px}
.water-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--c3);background:var(--c2);color:var(--txt);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
</style>
</head>

/* ══════════════════════════════════════
   STORAGE HELPERS
══════════════════════════════════════ */
let storageAvailable=true;
function lsG(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function lsDel(k){try{localStorage.removeItem(k);}catch{}}
function todayKey(){return new Date().toISOString().split("T")[0];}
function monthKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}

function checkStorage(){
  try{
    localStorage.setItem("__test__","1");
    localStorage.removeItem("__test__");
  }catch{
    storageAvailable=false;
    document.getElementById("warn-banner").style.display="block";
  }
}

/* ══════════════════════════════════════
   DRAFT AUTO-SAVE
   Key: ws_draft:YYYY-MM-DD (separate from sess:)
══════════════════════════════════════ */
function saveDraft(dl){
  if(!WS[dl])return;
  lsS("ws_draft:"+todayKey(),{dl,state:WS[dl]});
}

function checkDraft(){
  // Only restore draft if no completed session exists for today
  const existing=lsG("sess:"+todayKey());
  if(existing)return;
  const draft=lsG("ws_draft:"+todayKey());
  if(!draft)return;
  WS[draft.dl]=draft.state;
}

function clearDraft(){
  lsDel("ws_draft:"+todayKey());
}

/* ══════════════════════════════════════
   WORKOUT STATE
══════════════════════════════════════ */
let WS={};

function initWS(dl,def){
  if(!WS[dl])WS[dl]={
    ex:def.ex.map(e=>({name:e.n,origName:e.n,sets:Array.from({length:e.s},()=>({w:"",r:"",done:false}))})),
    subOpen:null,note:""
  };
}

function updSet(dl,ei,si,f,v){
  if(!WS[dl])return;
  WS[dl].ex[ei].sets[si][f]=v;
  saveDraft(dl); // auto-save every keystroke
}

function togDone(dl,ei,si){
  if(!WS[dl])return;
  WS[dl].ex[ei].sets[si].done=!WS[dl].ex[ei].sets[si].done;
  saveDraft(dl);
  renderToday();
}

/* ══════════════════════════════════════
   OVERLOAD LOGIC — GRANULAR
   compound:true  → +2.5kg
   compound:false → +1.0kg
   noweight:true  → reps/time only
══════════════════════════════════════ */
function getSuggestion(origEx,bestSet){
  if(!bestSet||!bestSet.w){
    if(origEx.noweight)return"Log reps/time this session to get a suggestion";
    return"No data — log this session to get next-week targets";
  }
  const range=origEx.r;
  // Time/bodyweight — no weight to add
  if(origEx.noweight){
    if(range==="Max reps")return"Beat last time: aim for more than "+bestSet.r+" reps";
    if(range.includes("each"))return"Add 1 rep per side (was "+bestSet.r+")";
    return"Add 5 seconds to each set";
  }
  const w=parseFloat(bestSet.w);
  const r=parseInt(bestSet.r);
  const inc=origEx.compound!==false?2.5:1.0; // default compound if not specified
  if(range.includes("–")){
    const[lo,hi]=range.split("–").map(Number);
    if(r>=hi)return"Increase to "+(w+inc).toFixed(1)+"kg — you maxed at "+hi+" reps";
    if(r>=Math.ceil((lo+hi)/2))return"Hold "+w+"kg — push for "+hi+" reps";
    return"Hold "+w+"kg — hit "+lo+" reps minimum first";
  }
  const target=parseInt(range)||r;
  if(r>=target)return"Increase to "+(w+inc).toFixed(1)+"kg";
  return"Hold "+w+"kg — aim for "+target+" reps";
}

/* ══════════════════════════════════════
   SAVE SESSION
   Now saves full sets array for Edit Session recovery
══════════════════════════════════════ */
function saveSession(dl,jsDay){
  const gd=DAYS.find(d=>d.js===jsDay);
  const s=WS[dl];if(!s||!gd)return;
  const exercises=s.ex.map((ex,ei)=>{
    const best=ex.sets.reduce((b,st)=>{
      if(st.w&&st.r&&(!b||parseFloat(st.w)>parseFloat(b.w)))return{w:st.w,r:st.r};
      return b;
    },null);
    return{
      name:ex.name,origName:ex.origName,
      best,
      sets:ex.sets, // full sets saved for Edit Session
      suggestion:getSuggestion(gd.ex[ei],best)
    };
  });
  const session={date:todayKey(),dl,exercises,note:s.note,skipped:false};
  lsS("sess:"+todayKey(),session);
  lsS("last:"+dl,{date:todayKey(),exercises});
  const mlog=lsG("mlog:"+monthKey())||{};
  mlog[todayKey()]={type:"completed",dl};
  lsS("mlog:"+monthKey(),mlog);
  clearDraft(); // remove draft now session is finalised
  const cb=document.getElementById("confbox");
  if(cb){cb.style.display="block";setTimeout(()=>{cb.style.display="none";renderToday();},4000);}
}

/* ══════════════════════════════════════
   EDIT COMPLETED SESSION
   Pulls saved data back into WS, unlocks form
══════════════════════════════════════ */
function editSession(){
  if(!confirm("This will unlock today's session for editing. Your current save will be removed. Continue?"))return;
  const existing=lsG("sess:"+todayKey());
  if(!existing||existing.skipped)return;
  const jd=new Date().getDay();
  const gd=DAYS.find(d=>d.js===jd);if(!gd)return;
  // Restore WS from saved session (full sets if available, otherwise reconstruct from best)
  WS[existing.dl]={
    ex:existing.exercises.map((ex,ei)=>{
      const origEx=gd.ex[ei]||gd.ex[0];
      let sets;
      if(ex.sets&&ex.sets.length){
        sets=ex.sets;
      }else{
        // Legacy: only best was saved — put best in S1, rest empty
        sets=Array.from({length:origEx.s},(_,si)=>si===0&&ex.best?{...ex.best,done:true}:{w:"",r:"",done:false});
      }
      return{name:ex.name,origName:ex.origName,sets};
    }),
    subOpen:null,note:existing.note||""
  };
  // Remove the completed session record
  lsDel("sess:"+todayKey());
  const mlog=lsG("mlog:"+monthKey())||{};
  delete mlog[todayKey()];
  lsS("mlog:"+monthKey(),mlog);
  renderToday();
}

/* ══════════════════════════════════════
   EXPORT — ALL localStorage keys
══════════════════════════════════════ */
function exportData(){
  const all={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&!k.startsWith("ws_draft:"))all[k]=lsG(k); // exclude active drafts
  }
  const blob=new Blob([JSON.stringify(all,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="roshan-fitness-"+todayKey()+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  // Record last export date
  lsS("last_export",todayKey());
  renderProgress();
}

/* ══════════════════════════════════════
   IMPORT — Restore from JSON file
══════════════════════════════════════ */
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(!confirm("IMPORTANT: This will replace ALL your current data with the backup file. This cannot be undone. Are you sure?"))return;
    try{
      const data=JSON.parse(e.target.result);
      localStorage.clear();
      Object.entries(data).forEach(([k,v])=>lsS(k,v));
      alert("Data restored successfully. The app will now reload.");
      location.reload();
    }catch{alert("Could not read backup file. Make sure it is a valid Roshan Fitness backup JSON.");}
  };
  reader.readAsText(file);
  input.value="";
}

/* ══════════════════════════════════════
   RENDER PROGRESS
══════════════════════════════════════ */
function getConsistency(){
  const mlog=lsG("mlog:"+monthKey())||{};
  let planned=0,done=0,flare=0,miss=0;
  const now=new Date();
  for(let d=1;d<=now.getDate();d++){
    const dt=new Date(now.getFullYear(),now.getMonth(),d);
    if(!DAYS.find(dd=>dd.js===dt.getDay()))continue;
    planned++;
    const k=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const entry=mlog[k];
    if(!entry){miss++;continue;}
    if(entry.type==="completed")done++;
    else if(entry.reason==="flare")flare++;
    else miss++;
  }
  return{planned,done,flare,miss};
}

  html+=`<div class="pgrid">
    <div class="pstat"><div class="pval">${con.done}</div><div class="plbl">sessions done</div></div>
    <div class="pstat"><div class="pval">${score}%</div><div class="plbl">consistency</div></div>
    <div class="pstat"><div class="pval">${con.flare}</div><div class="plbl">flare days</div></div>
    <div class="pstat"><div class="pval">${con.miss}</div><div class="plbl">missed</div></div>
  </div>`;

  if(con.planned>0){
    const col=score>=80?"var(--grn)":score>=60?"var(--amb)":"var(--red)";
    html+=`<div class="card">
      <div class="cl">This month</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <div style="font-size:13px;color:var(--mut)">${con.done} of ${con.planned} gym days</div>
        <div style="font-size:13px;font-weight:700">${score}%</div>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${Math.min(score,100)}%;background:${col}"></div></div>
      ${con.flare>0?`<div style="font-size:11px;color:var(--mut);margin-top:6px">${con.flare} flare day(s) — not counted against you</div>`:""}
    </div>`;
  }

  // Body stats
  html+=`<div class="card">
    <div class="cl">Body stats — weekly log</div>
    <div class="ct" style="margin-bottom:4px">Samsung Watch data</div>
    <div class="cs" style="margin-bottom:12px">Log once a week — same day, same time</div>
    ${latest?`<div style="background:var(--c2);border-radius:10px;padding:10px;margin-bottom:12px">
      <div style="font-size:11px;color:var(--mut);margin-bottom:8px">Latest: ${latest.date}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${[["Weight",latest.wt,"kg"],["Body fat",latest.bf,"%"],["Muscle",latest.mm,"kg"],["Fat mass",latest.fm,"kg"],["Water",latest.bw,"%"]].filter(([,v])=>v).map(([l,v,u])=>`<div style="background:var(--c1);border-radius:8px;padding:8px 10px;text-align:center;flex:1;min-width:70px"><div style="font-size:14px;font-weight:700;color:var(--amb)">${v}${u}</div><div style="font-size:10px;color:var(--mut);margin-top:1px">${l}</div></div>`).join("")}
      </div>
    </div>`:""}
    ${[["Weight (kg)","wt","85"],["Body fat (%)","bf","26"],["Fat mass (kg)","fm","22"],["Skeletal muscle (kg)","mm","30"],["Body water (%)","bw","46"]].map(([l,id,ph])=>`<div class="statrow"><div style="font-size:12px;color:var(--mut);min-width:140px">${l}</div><input class="sinput" type="number" inputmode="decimal" id="st_${id}" placeholder="${ph}" step="0.1" style="width:90px;text-align:center"></div>`).join("")}
    <button class="btn btn-amb" onclick="saveStats()">Save this week</button>
    <div id="stconf" class="confbox">Stats saved \u2713</div>
  </div>`;

  if(latest){
    html+=`<div class="card">
      <div class="cl">Progress toward targets</div>
      <div class="ct" style="margin-bottom:12px">Where you are going</div>
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <div style="font-size:13px;color:var(--mut)">Body fat ${latest.bf}% \u2192 target &lt;16%</div>
          <div style="font-size:12px;font-weight:700;color:${latest.bf<=16?"var(--grn)":"var(--amb)"}">${latest.bf}%</div>
        </div>
        <div class="prog-bar"><div class="prog-fill" style="width:${Math.max(0,Math.min((26-latest.bf)/10*100,100))}%;background:var(--grn)"></div></div>
      </div>
      ${[["Body weight",`${latest.wt}kg`,"83\u201390kg",latest.wt>=83&&latest.wt<=90],["Skeletal muscle",`${latest.mm||"\u2014"}kg`,"Maintain or grow",true]].map(([l,c,t,ok])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--c3)"><div style="font-size:13px;color:var(--mut)">${l}</div><div style="text-align:right"><div style="font-size:13px;font-weight:600;color:${ok?"var(--grn)":"var(--amb)"}">${c}</div><div style="font-size:11px;color:var(--dim)">${t}</div></div></div>`).join("")}
    </div>`;
  }

  // Session history
  const recents=[];const now=new Date();
  for(let d=0;d<14;d++){
    const dt=new Date(now);dt.setDate(dt.getDate()-d);
    const s=lsG("sess:"+dt.toISOString().split("T")[0]);if(s)recents.push(s);
  }
  if(recents.length){
    html+=`<div class="card">
      <div class="cl">Recent sessions — last 14 days</div>
      <div class="ct" style="margin-bottom:10px">History</div>
      ${recents.map(s=>`<div class="hitem">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-size:13px;font-weight:600">${s.date}</div><div style="font-size:12px;color:var(--mut)">${s.dl}</div></div>
          <div class="pill ${s.skipped?(s.skipReason==="flare"?"pr":"pa"):"pg"}">${s.skipped?(s.skipReason==="flare"?"Flare":s.skipReason==="tired"?"Tired":"Busy"):"Done \u2713"}</div>
        </div>
        ${s.note?`<div style="font-size:11px;color:var(--dim);margin-top:3px;font-style:italic">"${s.note}"</div>`:""}
      </div>`).join("")}
    </div>`;
  }

  // Symptom history
  const symHistory=[];
  for(let d=0;d<7;d++){
    const dt=new Date(now);dt.setDate(dt.getDate()-d);
    const sym=lsG("sym:"+dt.toISOString().split("T")[0]);
    if(sym&&sym.energy)symHistory.push(sym);
  }
  if(symHistory.length){
    html+=`<div class="card">
      <div class="cl">Health log — last 7 days</div>
      <div class="ct" style="margin-bottom:10px">Show this to your gastroenterologist</div>
      ${symHistory.map(s=>`<div class="hitem">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:12px;color:var(--mut)">${s.date}</div>
          <div style="display:flex;gap:10px;font-size:12px">
            <span>\u26a1 ${s.energy||"\u2014"}/5</span><span>\ud83e\ude7a ${s.seton||"\u2014"}/5</span>
            <span style="color:${s.bowel==="normal"?"var(--grn)":s.bowel?"var(--red)":"var(--dim)"}">${s.bowel==="normal"?"\u2713 Normal":s.bowel==="off"?"\u26a0 Off":"\u2014"}</span>
          </div>
        </div>
      </div>`).join("")}
    </div>`;
  }

  document.getElementById("p1").innerHTML=html;
}

function saveStats(){
  const fields=["wt","bf","fm","mm","bw"];
  const entry={date:todayKey()};
  fields.forEach(f=>{const v=document.getElementById("st_"+f)?.value;if(v)entry[f]=parseFloat(v);});
  if(!entry.wt&&!entry.bf)return;
  const all=lsG("bstats")||[];all.push(entry);lsS("bstats",all.slice(-52));
  const c=document.getElementById("stconf");if(c){c.style.display="block";setTimeout(()=>{c.style.display="none";renderProgress();},2000);}
}

/* ══════════════════════════════════════
   FOOD SECTION
══════════════════════════════════════ */
function allFoods(){
  const custom=lsG("custom_foods")||[];
  return[...FOODS,...custom.map(f=>({...f,cat:"My foods"}))];
}

function foodOptsHtml(){
  const cats={};
  allFoods().forEach(f=>{if(!cats[f.cat])cats[f.cat]=[];cats[f.cat].push(f);});
  return Object.entries(cats).map(([cat,foods])=>
    `<optgroup label="${cat}">${foods.map(f=>`<option value="${f.name}">${f.name}${f.lbl?" ("+f.lbl+")":""}</option>`).join("")}</optgroup>`
  ).join("");
}

function renderFood(){
  const todayLog=lsG("food:"+todayKey())||[];
  const totalK=todayLog.reduce((s,i)=>s+i.k,0);
  const totalP=todayLog.reduce((s,i)=>s+i.p,0);
  const opts=foodOptsHtml();

  document.getElementById("p2").innerHTML=`
  <div class="seg">
    <button class="segb on" id="fsb-p" onclick="showFS('p')">Cook</button>
    <button class="segb" id="fsb-l" onclick="showFS('l')">Log</button>
    <button class="segb" id="fsb-a" onclick="showFS('a')">Foods</button>
  </div>

  <div id="fs-p">
    <div class="card">
      <div class="ct" style="margin-bottom:4px">Plan what to cook</div>
      <div class="cs" style="margin-bottom:12px">How much raw ingredient to buy + macros per plate for you and wife</div>
      <select class="foodsel" id="pg-food">${opts}</select>
      <div class="statrow"><div style="font-size:12px;color:var(--mut)">Number of meals</div>
        <select class="sinput" id="pg-meals" style="width:60px">${[1,2,3,4,5].map(n=>`<option${n===3?" selected":""}>${n}</option>`).join("")}</select>
      </div>
      <div class="statrow"><div style="font-size:12px;color:var(--mut)">Your portion</div>
        <select class="sinput" id="pg-you" style="width:130px">
          <option value="100">Small (~100g)</option><option value="150" selected>Medium (~150g)</option>
          <option value="200">Large (~200g)</option><option value="250">XL (~250g)</option>
        </select>
      </div>
      <div class="statrow"><div style="font-size:12px;color:var(--mut)">Second plate (wife / guest)</div>
        <select class="sinput" id="pg-wife" style="width:130px">
          <option value="0">No second plate</option>
          <option value="70">Small (~70g)</option>
          <option value="90" selected>Medium (~90g)</option>
          <option value="120">Large (~120g)</option>
          <option value="150">XL (~150g)</option>
        </select>
      </div>
      <button class="btn btn-amb" onclick="calcPortions()">Calculate</button>
      <div id="pg-result"></div>
    </div>
  </div>

  <div id="fs-l" style="display:none">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div class="ct">Today's food log</div><div class="cs">${todayKey()}</div></div>
        <div style="text-align:right">
          <div style="font-size:15px;font-weight:700;color:${totalP>=130?"var(--grn)":"var(--amb)"}">${Math.round(totalP)}g<span style="font-size:10px;color:var(--mut)">/150g</span></div>
          <div style="font-size:11px;color:var(--mut)">${Math.round(totalK)}/2100 kcal</div>
        </div>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${Math.min(totalP/150*100,100)}%;background:var(--grn)"></div></div>
      <div class="prog-bar" style="margin-top:4px"><div class="prog-fill" style="width:${Math.min(totalK/2100*100,100)}%;background:var(--amb)"></div></div>
      <div class="sep"></div>
      <select class="foodsel" id="ml-food">${opts}</select>
      <div class="statrow" style="margin-bottom:8px">
        <div style="font-size:12px;color:var(--mut)">Amount (g or pieces)</div>
        <input class="sinput" type="number" inputmode="decimal" id="ml-amt" placeholder="150" style="width:80px;text-align:center">
      </div>
      <button class="btn btn-amb btn-sm" style="width:100%;margin-bottom:12px" onclick="logMeal()">+ Add to today</button>
      ${todayLog.length===0?`<div style="font-size:13px;color:var(--dim);text-align:center;padding:12px">No meals logged yet</div>`:""}
      ${todayLog.map((item,i)=>`<div class="mitem">
        <div style="flex:1"><div style="font-size:13px;font-weight:600">${item.name}</div>
        <div style="font-size:11px;color:var(--mut)">${item.amt}g \xb7 ${Math.round(item.k)}kcal \xb7 ${Math.round(item.p)}g protein</div></div>
        <button onclick="removeMeal(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px">\xd7</button>
      </div>`).join("")}
    </div>
  </div>

  <div id="fs-a" style="display:none">
    <div class="card">
      <div class="ct" style="margin-bottom:4px">Manage your food list</div>
      <div class="cs" style="margin-bottom:12px">Add any food you eat regularly. It appears in Cook and Log permanently.</div>
      ${[["Food name","cf-n","text","Kothu roti"],["Calories per 100g","cf-k","decimal","200"],["Protein per 100g","cf-p","decimal","15"],["Carbs per 100g","cf-c","decimal","20"],["Fat per 100g","cf-f","decimal","5"],["Typical serving (g)","cf-t","decimal","150"]].map(([l,id,mode,ph])=>`<div class="statrow"><div style="font-size:12px;color:var(--mut);min-width:130px">${l}</div><input class="sinput" id="${id}" ${id==="cf-n"?'type="text"':`type="number" inputmode="${mode}"`} placeholder="${ph}" style="width:110px"></div>`).join("")}
      <button class="btn btn-amb" onclick="addCustomFood()">Save to my foods</button>
      <div id="cf-conf" class="confbox">Food added \u2713 — appears in all dropdowns now</div>
    </div>
    <div id="cf-list"></div>
  </div>`;

  renderCustomFoodList();
}

function showFS(s){
  ["p","l","a"].forEach(x=>{
    document.getElementById("fsb-"+x).classList.toggle("on",x===s);
    document.getElementById("fs-"+x).style.display=x===s?"block":"none";
  });
}

function calcPortions(){
  const fname=document.getElementById("pg-food").value;
  const food=allFoods().find(f=>f.name===fname);if(!food)return;
  const meals=parseInt(document.getElementById("pg-meals").value);
  const myG=parseInt(document.getElementById("pg-you").value);
  const wifeG=parseInt(document.getElementById("pg-wife").value); // now from dropdown
  const totalCooked=myG*meals+(wifeG>0?wifeG*meals:0);
  const rawNeeded=food.rr?Math.ceil(totalCooked/food.rr/50)*50:null;
  const myK=food.per100.k*myG/100;const myP=food.per100.p*myG/100;
  const wifeK=food.per100.k*wifeG/100;const wifeP=food.per100.p*wifeG/100;
  const isEgg=food.name.toLowerCase().includes("egg");

  document.getElementById("pg-result").innerHTML=`<div class="presult">
    <div style="font-size:14px;font-weight:700;color:var(--amb);margin-bottom:10px">${food.name} \xb7 ${meals} meal(s)</div>
    ${rawNeeded?`<div class="macrow"><span style="color:var(--mut)">Buy raw</span><span class="macval">${rawNeeded}g</span></div>`:""}
    <div class="macrow"><span style="color:var(--mut)">Total cooked</span><span class="macval">${totalCooked}g</span></div>
    <div style="font-size:11px;color:var(--dim);margin:8px 0 4px">Per meal \u2014 your plate:</div>
    <div class="macrow"><span>Portion</span><span class="macval">${isEgg?Math.round(myG/food.typ)+" egg(s)":myG+"g"}</span></div>
    <div class="macrow"><span>Calories</span><span class="macval">${Math.round(myK)} kcal</span></div>
    <div class="macrow"><span>Protein</span><span class="macval">${myP.toFixed(1)}g</span></div>
    ${wifeG>0?`<div style="font-size:11px;color:var(--dim);margin:8px 0 4px">Per meal \u2014 second plate:</div>
    <div class="macrow"><span>Portion</span><span class="macval">${isEgg?Math.round(wifeG/food.typ)+" egg(s)":wifeG+"g"}</span></div>
    <div class="macrow"><span>Calories</span><span class="macval">${Math.round(wifeK)} kcal</span></div>
    <div class="macrow"><span>Protein</span><span class="macval">${wifeP.toFixed(1)}g</span></div>`:""}
  </div>
  <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="quickLog('${food.name}',${myG})">+ Log my portion to today</button>`;
}

function quickLog(fname,amt){
  const food=allFoods().find(f=>f.name===fname);if(!food)return;
  const log=lsG("food:"+todayKey())||[];
  log.push({name:food.name,amt,unit:"g",k:food.per100.k*amt/100,p:food.per100.p*amt/100});
  lsS("food:"+todayKey(),log);
  document.getElementById("pg-result").innerHTML+=`<div class="nt ng">Logged to today \u2713</div>`;
}

function logMeal(){
  const fname=document.getElementById("ml-food").value;
  const amt=parseFloat(document.getElementById("ml-amt").value);
  if(!fname||!amt)return;
  const food=allFoods().find(f=>f.name===fname);if(!food)return;
  const log=lsG("food:"+todayKey())||[];
  log.push({name:food.name,amt,unit:"g",k:food.per100.k*amt/100,p:food.per100.p*amt/100});
  lsS("food:"+todayKey(),log);
  renderFood();showFS("l");
}

function removeMeal(i){
  const log=lsG("food:"+todayKey())||[];log.splice(i,1);lsS("food:"+todayKey(),log);
  renderFood();showFS("l");
}

function addCustomFood(){
  const name=document.getElementById("cf-n").value.trim();
  const k=parseFloat(document.getElementById("cf-k").value);
  const p=parseFloat(document.getElementById("cf-p").value);
  const c=parseFloat(document.getElementById("cf-c").value)||0;
  const f=parseFloat(document.getElementById("cf-f").value)||0;
  const typ=parseFloat(document.getElementById("cf-t").value)||100;
  if(!name||!k||!p)return;
  const customs=lsG("custom_foods")||[];
  // Prevent duplicate names
  if(customs.find(x=>x.name.toLowerCase()===name.toLowerCase())){
    alert("A food with this name already exists.");return;
  }
  customs.push({name,cat:"My foods",per100:{k,p,c,f},typ});
  lsS("custom_foods",customs);
  const conf=document.getElementById("cf-conf");
  if(conf){conf.style.display="block";setTimeout(()=>{conf.style.display="none";renderFood();showFS("a");},2000);}
}

function deleteCustomFood(i){
  if(!confirm("Delete this food?"))return;
  const customs=lsG("custom_foods")||[];customs.splice(i,1);lsS("custom_foods",customs);
  renderFood();showFS("a");
}

function renderCustomFoodList(){
  const el=document.getElementById("cf-list");if(!el)return;
  const customs=lsG("custom_foods")||[];
  if(!customs.length){el.innerHTML="";return;}
  el.innerHTML=`<div class="card"><div class="cl">My custom foods (${customs.length})</div><div class="ct" style="margin-bottom:10px">Tap \xd7 to delete</div>
    ${customs.map((f,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--c3)">
      <div><div style="font-size:13px;font-weight:600">${f.name}</div><div style="font-size:11px;color:var(--mut)">${f.per100.k}kcal \xb7 ${f.per100.p}g protein per 100g</div></div>
      <button onclick="deleteCustomFood(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px">\xd7</button>
    </div>`).join("")}
  </div>`;
}

/* ══════════════════════════════════════
   FLARE GUIDE
══════════════════════════════════════ */
function renderFlare(){
  const traffic=[
    {col:"var(--grn)",bg:"ng",label:"Green \u2014 train as planned",signs:["Normal energy for the day","No pain beyond your usual baseline","Normal bowel habits","No fever or chills","Seton area: normal drainage, no extra pain"],action:"Full session. Stick to the plan."},
    {col:"var(--amb)",bg:"na",label:"Amber \u2014 modified session",signs:["More tired than usual, not completely floored","Mild bloating or cramps","Energy 60\u201370% of normal","Seton area slightly more uncomfortable","Bowel habits slightly off"],action:"Drop weight 20%, cut 1 set per exercise, rest 2\u20133 min. Leave before exhaustion."},
    {col:"var(--red)",bg:"nr",label:"Red \u2014 rest today. No gym.",signs:["Can't imagine exercising","Abdominal pain or cramping","Fever or chills (even 37.5\u00b0C+)","Increased seton discharge, pain or swelling","More frequent or loose stools","Joint aches flaring"],action:"Rest, hydrate, eat gentle. One red day does not break progress."}
  ];
  document.getElementById("p3").innerHTML=
    `<p style="font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:14px">Check this before every session. 30 seconds. Non-negotiable while pre-biologic.</p>`+
    traffic.map(t=>`<div class="card" style="border-left:3px solid ${t.col};margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div class="dot" style="background:${t.col}"></div><div style="font-size:14px;font-weight:600">${t.label}</div></div>
      <div style="font-size:13px;color:var(--mut);line-height:1.85">${t.signs.join("<br>")}</div>
      <div class="nt ${t.bg}">${t.action}</div>
    </div>`).join("")+
    `<div class="card" style="border-left:3px solid var(--amb)">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">Pre-biologic reality</div>
      <div style="font-size:13px;color:var(--mut);line-height:1.7">Inflammation is currently uncontrolled. Energy crashes are your body spending fuel on active disease \u2014 not weakness. Once infliximab kicks in (6\u201314 weeks post first infusion) energy and recovery improve significantly. Train smart until then.</div>
    </div>`;
}

/* ══════════════════════════════════════
   TABS + INIT
══════════════════════════════════════ */
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const t=parseInt(btn.dataset.t);
    document.querySelectorAll(".pnl").forEach((p,i)=>p.classList.toggle("on",i===t));
    if(t===1)renderProgress();
    if(t===2)renderFood();
  });
});

checkStorage();
checkDraft();  // restore any in-progress session before rendering
const jd=new Date().getDay();
document.getElementById("hsub").textContent=`${DNAMES[jd]} \xb7 Pre-biologic \xb7 Target 85\u201388kg at 14\u201316% BF`;
renderToday();
renderFlare();
</script>
</body>
</html>
