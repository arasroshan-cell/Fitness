<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E0A339">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Roshan Fitness v2.2j</title>
<style>
:root{
  --bg:#15110D;--c1:#1E1811;--c2:#2A2118;--c3:#3D2F1F;
  --cyan:#E0A339;--cbg:rgba(224,163,57,.14);--cbr:rgba(224,163,57,.32);
  --amb:#C9722E;--abg:rgba(201,114,46,.15);--abr:rgba(201,114,46,.32);
  --txt:#F3E9D8;--mut:#A6906F;--dim:#6E5D45;
  --grn:#8FAE63;--gbg:rgba(143,174,99,.14);--gbr:rgba(143,174,99,.32);
  --red:#C2404A;--rbg:rgba(194,64,74,.14);--rbr:rgba(194,64,74,.32);
  --gold:#D4AF37;--purple:#8B6F9E
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:15px;max-width:480px;margin:0 auto;padding-bottom:90px}
/* HEADER */
.hdr{padding:16px 16px 12px;background:var(--bg);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--c3)}
.ey{font-size:10px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;margin-bottom:3px;font-weight:700}
.ht{font-size:24px;font-family:"Barlow",sans-serif;font-weight:900;background:linear-gradient(90deg,var(--txt) 50%,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hs{font-size:13px;color:var(--mut);margin-top:3px}
.mrow{display:flex;gap:6px;margin-top:10px}
.met{flex:1;background:var(--c1);border:1px solid var(--c3);border-radius:12px;padding:9px 6px;text-align:center;position:relative;overflow:hidden}
.met::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.mv{font-size:18px;font-family:"Barlow",sans-serif;font-weight:800;color:var(--cyan)}
.mv.warn{color:var(--amb)}
.ml{font-size:10px;color:var(--mut);margin-top:1px;font-weight:500}
/* TABS */
.tabs{display:flex;background:var(--c1);border-bottom:1px solid var(--c3);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:14px 18px;border:none;background:transparent;color:var(--mut);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:"IBM Plex Sans",sans-serif;border-bottom:2px solid transparent;flex-shrink:0;transition:color .2s}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.pnl{padding:14px;display:none}
.pnl.on{display:block}
/* CARDS */
.card{background:var(--c1);border:1px solid var(--c3);border-radius:16px;padding:16px;margin-bottom:12px}
.card.gym{border-color:var(--cbr);box-shadow:0 0 24px rgba(0,194,212,.06)}
.card.success{border-color:var(--gbr)}
.card.warm{border-color:var(--abr)}
.card.danger{border-color:var(--rbr)}
.card.cyan{border-color:var(--cbr);background:linear-gradient(135deg,var(--c1),rgba(0,194,212,.05))}
.cl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:700}
.ct{font-size:17px;font-weight:700;font-family:"Barlow",sans-serif}
.cs{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.5}
.sep{height:1px;background:var(--c3);margin:12px 0}
/* BADGES + NOTICES */
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.pg{background:var(--gbg);color:var(--grn)}.pa{background:var(--abg);color:var(--amb)}.pr{background:var(--rbg);color:var(--red)}.pi{background:var(--cbg);color:var(--cyan)}.pd{background:var(--c2);color:var(--mut)}
.pill-pr{background:linear-gradient(90deg,rgba(212,175,55,.15),var(--cbg));color:var(--gold);border:1px solid rgba(212,175,55,.35);font-size:12px;padding:4px 12px;font-family:"Barlow",sans-serif;font-weight:800}
.nt{border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-top:10px;line-height:1.5}
.ng{background:var(--gbg);color:var(--grn)}.na{background:var(--abg);color:var(--amb)}.nr{background:var(--rbg);color:var(--red)}.ni{background:var(--cbg);color:var(--cyan)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
/* SESSION HEADER */
.sess-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--c3)}
.sess-timer{font-family:"Barlow",sans-serif;font-size:22px;font-weight:800;color:var(--cyan)}
/* SECTION DIVIDERS */
.sect-div{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.sect-lbl{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.sect-lbl.must{color:var(--cyan)}.sect-lbl.opt{color:var(--dim)}
.sect-line{flex:1;height:1px;background:var(--c3)}
/* EXERCISES */
.exb{border-bottom:1px solid var(--c3);padding-bottom:16px;margin-bottom:16px}
.exb:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.exhd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.exn{font-size:18px;font-weight:700;font-family:"Barlow",sans-serif;line-height:1.2}
.exn.done{color:var(--grn)}
.subbed{font-size:10px;color:var(--amb);margin-top:2px;font-weight:700}
.ext{font-size:12px;color:var(--mut);margin-top:3px}
.wlbl{font-size:10px;color:var(--cyan);margin-top:2px;font-weight:600}
.exlast{font-size:12px;color:var(--cyan);text-align:right;flex-shrink:0;max-width:120px;line-height:1.5}
.exsugg{font-size:12px;color:var(--amb);text-align:right;margin-top:3px;font-weight:700}
/* SET ROWS */
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--c3)}
.srow:last-child{border-bottom:none}
.srow.setdone{background:rgba(0,230,118,.05);border-radius:10px;padding:8px 6px}
.srow.droprow{background:rgba(245,166,35,.07);border-radius:10px;padding:8px 6px}
.snum{font-size:12px;color:var(--dim);width:22px;text-align:center;flex-shrink:0;font-weight:700;font-family:"Barlow",sans-serif}
.setdel{background:none;border:none;color:var(--dim);font-size:11px;padding:2px;margin-top:3px;cursor:pointer;display:block;width:100%}
.dbadge{font-size:9px;font-weight:800;color:var(--amb);background:var(--abg);padding:1px 5px;border-radius:4px;display:block;text-align:center}
.nin{width:62px;padding:11px 6px;border:1px solid var(--c3);border-radius:10px;font-size:20px;font-weight:800;font-family:"Barlow",sans-serif;background:var(--c2);color:var(--txt);text-align:center;-webkit-appearance:none;transition:border-color .2s}
.nin:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px var(--cbg)}
.nin:disabled{opacity:.25}
.nin-lbl{font-size:10px;color:var(--mut);text-align:center;margin-top:2px;font-weight:600}
.tx{font-size:15px;color:var(--dim);font-weight:700}
.dbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--c3);background:var(--c2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;color:var(--mut);transition:all .2s}
.dbtn.dk{background:var(--gbg);border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px rgba(0,230,118,.2)}
/* CHOICE PICKER */
.choice-pick{display:flex;gap:8px;margin-bottom:10px}
.choice-btn{flex:1;padding:12px 8px;border:1px solid var(--c3);border-radius:12px;cursor:pointer;background:var(--c2);color:var(--mut);font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:600;text-align:center;min-height:44px;transition:all .2s}
.choice-btn.chosen{border-color:var(--cyan);background:var(--cbg);color:var(--cyan)}
/* SET CONTROLS */
.set-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.subbtn{font-size:12px;color:var(--mut);background:var(--c2);border:1px solid var(--c3);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-weight:600;min-height:36px}
.addbtn{font-size:12px;color:var(--grn);background:var(--gbg);border:1px solid var(--gbr);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-weight:700}
.dropbtn{font-size:12px;color:var(--amb);background:var(--abg);border:1px solid var(--abr);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-weight:700}
.subpanel{background:var(--c2);border-radius:12px;padding:12px;margin-top:8px;border:1px solid var(--cbr)}
.subopt{display:block;font-size:14px;color:var(--txt);padding:11px 10px;cursor:pointer;background:none;border:none;border-bottom:1px solid var(--c3);width:100%;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-weight:500}
.subopt:last-child{border-bottom:none}
/* REST TIMER */
.rest-timer{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cbg);border-radius:12px;margin:8px 0;border:1px solid var(--cbr)}
.rest-num{font-size:24px;font-weight:800;font-family:"Barlow",sans-serif;color:var(--cyan);min-width:70px}
/* INPUTS */
.genin{width:100%;padding:11px 12px;border:1px solid var(--c3);border-radius:10px;font-size:14px;background:var(--c1);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;transition:border-color .2s}
.genin::placeholder{color:var(--dim)}
.genin:focus{outline:none;border-color:var(--cyan)}
textarea.genin{resize:none}
/* BUTTONS */
.btn{padding:15px 16px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;width:100%;margin-top:10px;display:block;text-align:center;transition:opacity .2s,transform .1s}
.btn-amb{background:var(--amb);color:#000}.btn-cyan{background:var(--cyan);color:#000}
.btn-ghost{background:var(--c2);color:var(--txt);border:1px solid var(--c3)}
.btn-grn{background:var(--gbg);color:var(--grn);border:1px solid var(--gbr)}
.btn-sm{padding:10px 14px;font-size:13px;margin-top:6px}
.btn:active{opacity:.85;transform:scale(.98)}
/* STICKY SAVE */
.sticky-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 28px);z-index:100;display:none}
.sticky-save{background:linear-gradient(135deg,var(--cyan),var(--amb));color:#000;border:none;border-radius:16px;font-size:17px;font-weight:900;font-family:"Barlow",sans-serif;cursor:pointer;width:100%;padding:18px;box-shadow:0 4px 28px rgba(224,163,57,.4)}
.sticky-save:active{transform:scale(.97)}
/* CONFBOX + SKIP */
.confbox{background:var(--gbg);color:var(--grn);border:1px solid var(--gbr);border-radius:14px;padding:14px;font-size:15px;font-weight:700;text-align:center;display:none;margin-top:10px}
.skipsheet{background:var(--c2);border-radius:16px;padding:16px;margin-top:10px;border:1px solid var(--c3);display:none}
.skipopt{display:block;width:100%;padding:15px;margin-bottom:8px;border:1px solid var(--c3);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;background:var(--c1);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;text-align:left}
.skipopt:last-child{margin-bottom:0}
/* PROGRESS */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pstat{background:var(--c1);border:1px solid var(--c3);border-radius:14px;padding:14px;text-align:center}
.pval{font-size:28px;font-weight:900;font-family:"Barlow",sans-serif;color:var(--cyan)}
.plbl{font-size:11px;color:var(--mut);margin-top:3px;font-weight:600}
.prog-bar{background:var(--c2);border-radius:4px;height:6px;margin:5px 0;overflow:hidden}
.prog-fill{height:6px;border-radius:4px;transition:width .4s ease}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--c3);gap:8px}
.statrow:last-child{border-bottom:none}
.sinput{padding:9px;border:1px solid var(--c3);border-radius:9px;font-size:14px;background:var(--c2);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;transition:border-color .2s}
.sinput:focus{outline:none;border-color:var(--cyan)}
.hitem{padding:10px 0;border-bottom:1px solid var(--c3)}
.hitem:last-child{border-bottom:none}
/* FOOD */
.foodsel{width:100%;padding:12px;border:1px solid var(--c3);border-radius:12px;font-size:14px;background:var(--c2);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;margin-bottom:8px;-webkit-appearance:none}
.foodsel:focus{outline:none;border-color:var(--cyan)}
.macrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--c3);font-size:14px}
.macrow:last-child{border-bottom:none}
.macval{font-weight:700;color:var(--cyan);font-family:"Barlow",sans-serif;font-size:16px}
.seg{display:flex;background:var(--c2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.segb{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:var(--mut);font-family:"IBM Plex Sans",sans-serif;white-space:nowrap;transition:color .2s}
.segb.on{background:var(--c1);color:var(--cyan);box-shadow:0 0 12px rgba(0,194,212,.1)}
/* MEAL TABLE */
.meal-group{margin-bottom:14px}
.meal-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--c2);border-radius:10px;margin-bottom:6px;cursor:pointer}
.meal-hd-name{font-size:12px;font-weight:800;color:var(--cyan);letter-spacing:1px;text-transform:uppercase}
.meal-hd-totals{font-size:12px;color:var(--mut);font-weight:600}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid var(--c3);gap:8px}
.meal-item:last-child{border-bottom:none}
.meal-item-name{font-size:13px;font-weight:600}
.meal-item-meta{font-size:11px;color:var(--mut);margin-top:2px}
.meal-add{display:flex;gap:8px;align-items:center;margin-top:6px;padding:6px 0}
/* PLATE BUILDER */
.plate-comp{background:var(--c2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--c3)}
.plate-comp-lbl{font-size:10px;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.plate-row{display:flex;gap:8px;align-items:center}
.plate-total{background:var(--cbg);border:1px solid var(--cbr);border-radius:12px;padding:14px;margin-top:10px;text-align:center}
/* WATER */
.water-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.water-count{font-size:32px;font-weight:900;font-family:"Barlow",sans-serif;color:var(--cyan);margin:0 12px;min-width:44px;text-align:center}
.water-count.full{color:var(--grn)}
.water-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--c3);background:var(--c2);color:var(--txt);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
/* SYMPTOM */
.sym-val-btn{flex:1;padding:10px 4px;border:1px solid var(--c3);border-radius:10px;font-size:16px;font-weight:800;font-family:"Barlow",sans-serif;cursor:pointer;background:var(--c2);color:var(--mut);text-align:center;min-height:44px;transition:all .15s}
/* AD-HOC / SESSION PICKER */
.sess-option{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border:1px solid var(--c3);border-radius:14px;cursor:pointer;background:var(--c1);transition:border-color .2s}
.free-ex-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--c3);cursor:pointer;font-size:14px}
.free-ex-row:last-child{border-bottom:none}
.sess-option:last-child{margin-bottom:0}
.sess-option:active{border-color:var(--cyan)}
.sess-option.suggested{border-color:var(--cbr);background:rgba(0,194,212,.04)}
/* MEASUREMENTS */
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.meas-stat{background:var(--c2);border-radius:10px;padding:10px;text-align:center}
.meas-val{font-size:20px;font-weight:800;font-family:"Barlow",sans-serif;color:var(--cyan)}
.meas-lbl{font-size:10px;color:var(--mut);margin-top:2px;font-weight:600}
.warn-banner{background:var(--rbg);color:var(--red);padding:11px;font-size:13px;font-weight:700;text-align:center;display:none}
/* HISTORY */
.hist-ex-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--c3);gap:8px}
.hist-ex-row:last-child{border-bottom:none}
.hist-date{font-size:13px;font-weight:600;color:var(--txt);min-width:90px}
.hist-best{font-size:14px;font-weight:800;font-family:"Barlow",sans-serif;color:var(--cyan)}
.hist-pr{font-size:10px;color:var(--gold);font-weight:800;margin-left:6px}
.day-strip{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.day-pill{flex-shrink:0;width:40px;text-align:center;cursor:pointer;border-radius:10px;padding:6px 4px;border:1px solid var(--c3);background:var(--c1);transition:all .2s}
.day-pill.hit{border-color:var(--gbr);background:var(--gbg)}
.day-pill.miss{border-color:var(--rbr);background:var(--rbg)}
.day-pill.part{border-color:var(--abr);background:var(--abg)}
.day-pill-name{font-size:9px;color:var(--mut);font-weight:700;text-transform:uppercase}
.day-pill-val{font-size:13px;font-weight:800;font-family:"Barlow",sans-serif;margin-top:2px}
.ex-search{width:100%;padding:12px;border:1px solid var(--c3);border-radius:12px;font-size:14px;background:var(--c2);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;margin-bottom:8px}
.ex-search:focus{outline:none;border-color:var(--cyan)}
.chart-wrap{background:var(--c2);border-radius:12px;padding:12px;margin-top:8px}
.chart-label{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
</style>
</head>
<body>
<div id="warn-banner" class="warn-banner">Private mode detected &#x2014; data will NOT be saved</div>
<div class="hdr">
  <div class="ey">Roshan Fitness v2.2j &middot; build 2026-08-08</div>
  <div class="ht">Fitness Tracker</div>
  <div class="hs" id="hsub">Loading...</div>
  <div class="mrow">
    <div class="met"><div class="mv" id="hdr-p">0g</div><div class="ml" id="hdr-p-lbl">/ 150g protein</div></div>
    <div class="met"><div class="mv" id="hdr-k">0</div><div class="ml" id="hdr-k-lbl">/ 2100 kcal</div></div>
    <div class="met"><div class="mv" id="hdr-wt">&#x2014;</div><div class="ml">3wk avg wt</div></div>
  </div>
</div>
<div class="tabs">
  <button class="tab on" data-t="0">Today</button>
  <button class="tab" data-t="1">Progress</button>
  <button class="tab" data-t="2">Food</button>
  <button class="tab" data-t="3">History</button>
  <button class="tab" data-t="4">Flare</button>
</div>
<div class="pnl on" id="p0"></div>
<div class="pnl" id="p1"></div>
<div class="pnl" id="p2"></div>
<div class="pnl" id="p3"></div>
<div class="pnl" id="p4"></div>
<div class="sticky-wrap" id="sticky-wrap">
  <button class="sticky-save" id="sticky-btn">Save &amp; Finish Workout</button>
</div>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">
<script>
/* ===== DATA ===== */
const SEQ=['Push day','Pull day','Legs + core','Upper body'];
const DAYS=[
  {label:'Push day',focus:'Chest \u00b7 Shoulders \u00b7 Triceps',time:'~6pm',ex:[

const SUB_TYPE_OVERRIDE={
  'Lat pulldown':{inputType:'weight',wlabel:'Stack weight'},
  'Assisted pull-ups (machine)':{inputType:'weight',wlabel:'Assist stack weight (lighter assist = harder)'},
  'Pull-ups':{inputType:'bodyweight',wlabel:'Bodyweight (add kg if weighted)',noweight:true},

function findExDef(name){
  for(const d of DAYS){for(const e of d.ex){
    if(e.n===name)return e;
    if(e.inputType==='choice'&&e.choiceOptions){const o=e.choiceOptions.find(o=>o.name===name);if(o)return{...e,...o};}
  }}
  for(const origName in SUBS){
    if(SUBS[origName].includes(name)){
      const origDef=DAYS.flatMap(d=>d.ex).find(x=>x.n===origName);
      const override=SUB_TYPE_OVERRIDE[name];
      return{
        n:name,s:origDef?.s||3,r:origDef?.r||'10\u201312',
        inputType:override?.inputType||origDef?.inputType||'weight',
        wlabel:override?.wlabel||inferSubWlabel(name)||origDef?.wlabel||'kg',
        noweight:override?.noweight||false,compound:origDef?.compound||false,
        primaryMuscles:origDef?.primaryMuscles||[],secondaryMuscles:origDef?.secondaryMuscles||[],
        subOf:origName
      };
    }
  }
  return null;
}
function inferSubWlabel(name){
  const n=name.toLowerCase();
  if(/smith machine/.test(n)){
    const sw=(lsG('bar_weights')||{}).smith;
    return sw?'Total kg incl. bar (Smith bar confirmed: '+sw+'kg)':'Total kg incl. bar (Smith bar weight varies by machine \u2014 check yours)';
  }
  if(/ez bar|ez curl/.test(n))return 'Total kg incl. bar (\u2248 10kg EZ bar)';
  if(/cable|machine|stack|pulldown|pec deck|dip/.test(n))return 'Stack weight';
  if(/single arm|one arm|one hand/.test(n))return 'Dumbbell weight (one hand)';
  if(/db |dumbbell/.test(n))return 'Per dumbbell (each hand)';
  if(/barbell|\bbb\b/.test(n))return 'Total kg incl. bar (\u2248 20kg Olympic bar)';
  return null;
}

function lsG(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function lsS(k,v){
  try{
    localStorage.setItem(k,JSON.stringify(v));
    return true;
  }catch(e){
    showStorageFailWarning();
    return false;
  }
}
function showStorageFailWarning(){
  if(document.getElementById('storage-fail-banner'))return;
  document.body.insertAdjacentHTML('afterbegin','<div id="storage-fail-banner" style="position:relative;z-index:998;background:var(--rbg);color:var(--red);font-size:13px;font-weight:700;padding:9px 14px;text-align:center">&#x26A0; Your device is out of storage space \u2014 this change may NOT have saved. Free up space or export/share your data now.</div>');
}

}

function lsDel(k){try{localStorage.removeItem(k);}catch{}}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function prevMonthKey(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function mergedMlog(){return{...(lsG('mlog:'+prevMonthKey())||{}),...(lsG('mlog:'+monthKey())||{})};}
function checkStorage(){try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__');}catch{document.getElementById('warn-banner').style.display='block';}}

/* ===== HEADER ===== */
function getSmoothedWeight(stats){
  const withWt=(stats||[]).filter(s=>s.wt);
  if(!withWt.length)return null;
  const last3=withWt.slice(-3);
  const avg=last3.reduce((s,e)=>s+parseFloat(e.wt),0)/last3.length;
  return{value:avg,smoothed:last3.length>1,entriesUsed:last3.length};
}
function updateHeader(){
  const log=lsG('food:'+todayKey())||[];
  const t=getProfile().targets;
  const p=Math.round(log.reduce((s,i)=>s+(i.p||0),0));
  const k=Math.round(log.reduce((s,i)=>s+(i.k||0),0));
  const stats=lsG('bstats')||[];
  const sw=getSmoothedWeight(stats);
  const wt=sw?sw.value.toFixed(1)+'kg'+(sw.smoothed?'*':''):'\u2014';
  const ep=document.getElementById('hdr-p'),ek=document.getElementById('hdr-k'),ew=document.getElementById('hdr-wt');
  const epl=document.getElementById('hdr-p-lbl'),ekl=document.getElementById('hdr-k-lbl');
  if(ep){ep.textContent=p+'g';ep.className='mv'+(p<t.protein*0.53?' warn':'');}
  if(epl)epl.textContent='/ '+t.protein+'\u2013'+Math.round(t.protein*1.15)+'g protein';
  if(ek){ek.textContent=k;ek.className='mv'+(k>t.kcal*1.1?' warn':'');}
  if(ekl)ekl.textContent='/ '+t.kcal+' kcal';
  if(ew)ew.textContent=wt;
}

/* ===== SEQUENCE ===== */
function getNextIdx(){
  const l=lsG('last_seq_idx');
  return(l===null||l===undefined)?null:(parseInt(l)+1)%4;
}
function getSkipWarnings(){
  const mlog=mergedMlog();
  const recent=Object.entries(mlog).sort((a,b)=>a[0].localeCompare(b[0])).map(e=>e[1]).filter(e=>e.type==='done').slice(-8).map(e=>e.seqIdx).filter(i=>i!==undefined);
  if(recent.length<4)return null;
  const last6=recent.slice(-6);
  const missing=SEQ.filter((_,i)=>!last6.includes(i));
  return missing.length?missing:null;
}

let WS={};
let adHocDay=null;
let adHocSeqIdx=null;
let _forcePickerOnce=false;

function initWS(dl,def){
  const pSubs=lsG('persisted_subs')||{};
  if(!WS[dl]){
    WS[dl]={
      ex:def.ex.map(e=>({
        name:pSubs[e.n]||e.n,origName:e.n,chosenType:null,
        sets:Array.from({length:e.s},()=>({w:'',r:'',done:false,isDrop:false}))
      })),
      subOpen:null,note:'',painNote:'',startAt:null,lastSetAt:null
    };
    return;
  }
  /* Reconcile a possibly-stale draft (e.g. loaded from before a source-code update) against
     the current exercise array, matching by origName so in-progress sets are preserved for
     exercises that still exist, instead of crashing on index misalignment for new ones. */
  const old=WS[dl].ex||[];
  WS[dl].ex=def.ex.map(e=>old.find(o=>o&&o.origName===e.n)||{
    name:pSubs[e.n]||e.n,origName:e.n,chosenType:null,
    sets:Array.from({length:e.s},()=>({w:'',r:'',done:false,isDrop:false}))
  });
  if(WS[dl].painNote===undefined)WS[dl].painNote='';
}
function updSet(dl,ei,si,f,v){if(!WS[dl])return;WS[dl].ex[ei].sets[si][f]=v;saveDraft(dl);}
function togDone(dl,ei,si){
  if(!WS[dl])return;
  const set=WS[dl].ex[ei].sets[si];
  set.done=!set.done;
  if(set.done){
    WS[dl].lastSetAt=Date.now();
    if(!WS[dl].startAt)WS[dl].startAt=Date.now();
  }
  saveDraft(dl);renderToday();
}
function addSet(dl,ei){
  if(!WS[dl])return;
  WS[dl].ex[ei].sets.push({w:'',r:'',done:false,isDrop:false});
  saveDraft(dl);renderToday();
}
function removeSet(dl,ei,si){
  if(!WS[dl])return;
  WS[dl].ex[ei].sets.splice(si,1);
  saveDraft(dl);renderToday();
}
function addDropSet(dl,ei){
  if(!WS[dl])return;
  const last=WS[dl].ex[ei].sets[WS[dl].ex[ei].sets.length-1];
  const dw=last.w?String(Math.round(parseFloat(last.w)*0.8/5)*5):'';
  WS[dl].ex[ei].sets.push({w:dw,r:'',done:false,isDrop:true,dropHint:'20% drop &#x2014; aim 10&#x2013;12 reps'});
  saveDraft(dl);renderToday();
}
function chooseExType(dl,ei,choice){
  if(!WS[dl])return;
  WS[dl].ex[ei].chosenType=choice;
  saveDraft(dl);renderToday();
}
function togSub(dl,ei){if(!WS[dl])return;WS[dl].subOpen=WS[dl].subOpen===ei?null:ei;renderToday();}
function pickSub(dl,ei,name){
  if(!WS[dl])return;
  WS[dl].ex[ei].name=name;WS[dl].subOpen=null;
  const subs=lsG('persisted_subs')||{};
  subs[WS[dl].ex[ei].origName]=name;
  lsS('persisted_subs',subs);
  saveDraft(dl);renderToday();
}
function resetSub(dl,ei){
  if(!WS[dl])return;
  const orig=WS[dl].ex[ei].origName;
  WS[dl].ex[ei].name=orig;WS[dl].subOpen=null;
  const subs=lsG('persisted_subs')||{};
  delete subs[orig];lsS('persisted_subs',subs);
  saveDraft(dl);renderToday();
}
function applyCSub(dl,ei,id){
  const v=document.getElementById(id)?.value?.trim();if(!v||!WS[dl])return;
  WS[dl].ex[ei].name=v;WS[dl].subOpen=null;saveDraft(dl);renderToday();
}

/* Pure logic, zero DOM access. v2.3's coaching cards call into this; nothing here renders anything. */
const Coach={
  getDailyStatus(dateKey){
    dateKey=dateKey||todayKey();
    const t=getProfile().targets;
    const log=lsG('food:'+dateKey)||[];
    const p=log.reduce((s,i)=>s+(i.p||0),0),k=log.reduce((s,i)=>s+(i.k||0),0),
          c=log.reduce((s,i)=>s+(i.c||0),0),f=log.reduce((s,i)=>s+(i.f||0),0);
    return{
      proteinGap:Math.max(0,t.protein-p),kcalGap:Math.max(0,t.kcal-k),
      carbsGap:Math.max(0,t.carbs-c),fatGap:Math.max(0,t.fat-f),
      onTrack:p>=t.protein&&k<=t.kcal*1.1
    };
  },
  getWeeklyStatus(){
    const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
    const entries=Object.entries(mergedMlog()).filter(([k])=>k>=cutoff).map(e=>e[1]);
    const done=entries.filter(e=>e.type==='done').length;
    let pSum=0,kSum=0,days=0;
    for(let i=0;i<7;i++){
      const d=new Date();d.setDate(d.getDate()-i);
      const dk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const log=lsG('food:'+dk);if(!log||!log.length)continue;
      pSum+=log.reduce((s,i)=>s+(i.p||0),0);kSum+=log.reduce((s,i)=>s+(i.k||0),0);days++;
    }
    return{sessionsDone:done,avgProtein:days?Math.round(pSum/days):0,avgKcal:days?Math.round(kSum/days):0,daysLogged:days};
  },
  get3SessionTrend(exerciseName){
    const hist=getExHistory(exerciseName).slice(-3);
    if(!hist.length)return{available:false};
    const best=hist.reduce((b,h)=>{
      if(!h.best)return b;
      const w=parseFloat(h.best.w)||0;
      return(!b||w>parseFloat(b.w||0))?h.best:b;
    },null);
    return{available:true,sessionsUsed:hist.length,bestOfLast3:best,mostRecent:hist[hist.length-1].best,improving:hist.length>=2&&parseFloat(hist[hist.length-1].best?.w||0)>=parseFloat(hist[0].best?.w||0)};
  },
  getSessionFeedback(session){
    if(!session||!session.totalVolume)return{available:false};
    const prevSess=lsG('last:'+session.dl);
    const prevVol=prevSess?.exercises?.reduce((v,e)=>v+(e.exVolume||0),0)||0;
    return{available:true,volume:session.totalVolume,prevVolume:prevVol,trend:prevVol?(session.totalVolume>=prevVol?'up':'down'):'first'};
  },
  getWeeklyMuscleVolume(){
    const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
    const vol={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||!k.startsWith('sess:'))continue;
      const sess=lsG(k);
      if(!sess||sess.skipped||!sess.exercises||sess.date<cutoff)continue;
      sess.exercises.forEach(e=>{
        const def=findExDef(e.origName);
        if(!def)return;
        const v=e.exVolume||0;
        (def.primaryMuscles||[]).forEach(m=>{vol[m]=(vol[m]||0)+v;});
        (def.secondaryMuscles||[]).forEach(m=>{vol[m]=(vol[m]||0)+v*0.5;});
      });
    }
    return Object.entries(vol).map(([muscle,volume])=>({muscle,volume:Math.round(volume)})).sort((a,b)=>b.volume-a.volume);
  }
};

function getSuggestion(orig,best,prKey){
  if(!best||!best.w)return orig.noweight?'Log to get targets':'No data yet \u2014 log this session';
  if(orig.inputType==='seconds'){
    const pr=prKey?lsG('pr:'+prKey):null;
    if(pr&&parseFloat(best.w)<parseFloat(pr.w))return 'Work back to PR: '+pr.w+'s (this session: '+best.w+'s)';
    return 'Add 5s next session (was '+best.w+'s)';
  }
  if(orig.inputType==='reps_each')return 'Add 1 rep per side (was '+best.w+' each side)';
  if(orig.noweight&&orig.r==='Max reps'){
    const pr=prKey?lsG('pr:'+prKey):null;
    if(pr&&parseInt(best.r||0)<parseInt(pr.r||0))return 'Work back to PR: '+pr.r+' reps (got '+best.r+' today)';
    return 'Beat '+best.r+' reps \u2014 add 1 per week';
  }
  const w=parseFloat(best.w),r=parseInt(best.r),inc=orig.compound!==false?2.5:1.0;
  const pr=prKey?lsG('pr:'+prKey):null;
  if(pr&&w<parseFloat(pr.w))return 'Work back to PR: '+parseFloat(pr.w).toFixed(1)+'kg (was '+w+'kg today)';
  if(orig.r.includes('\u2013')){
    const[lo,hi]=orig.r.split('\u2013').map(Number);
    if(r>=hi)return 'Increase to '+(w+inc).toFixed(1)+'kg \u2014 maxed '+hi+' reps';
    if(r>=(lo+hi)/2)return 'Hold '+w+'kg \u2014 push for '+hi+' reps';
    return 'Hold '+w+'kg \u2014 hit '+lo+' reps first';
  }
  const target=parseInt(orig.r)||r;
  return r>=target?'Increase to '+(w+inc).toFixed(1)+'kg':'Hold '+w+'kg \u2014 aim for '+target+' reps';
}

/* ===== PR DETECTION ===== */
function checkPR(origName,best,inputType){
  if(!best)return false;
  const key='pr:'+origName;const cur=lsG(key);
  const isRepsFirst=inputType==='bodyweight';
  const isTimeFirst=inputType==='seconds';
  if(isRepsFirst){
    if(!best.r||parseInt(best.r)<=0)return false;
    const bw=parseFloat(best.w||0),br=parseInt(best.r||0);
    const cw=cur?parseFloat(cur.w||0):0,cr=cur?parseInt(cur.r||0):0;
    if(!cur||br>cr||bw>cw){lsS(key,{w:best.w||'0',r:best.r,date:todayKey()});return true;}
    return false;
  }
  if(!best.w||parseFloat(best.w)<=0)return false;
  if(isTimeFirst){
    const bw=parseFloat(best.w),cw=cur?parseFloat(cur.w||0):0;
    if(!cur||bw>cw){lsS(key,{w:best.w,r:best.r,date:todayKey()});return true;}
    return false;
  }
  if(!cur||parseFloat(best.w)>parseFloat(cur.w)||(parseFloat(best.w)===parseFloat(cur.w)&&parseInt(best.r||0)>parseInt(cur.r||0))){
    lsS(key,{w:best.w,r:best.r,date:todayKey()});return true;
  }
  return false;
}

/* ===== SAVE SESSION ===== */
function bestSetOf(workingSets,inputType){
  const singleField=inputType==='seconds'||inputType==='reps_each';
  const repsFirst=inputType==='bodyweight';
  const metric=st=>repsFirst?parseInt(st.r||0):parseFloat(st.w||0);
  return workingSets.reduce((b,st)=>{
    const valid=singleField?(st.w&&parseFloat(st.w)>0):repsFirst?(st.r&&parseInt(st.r)>0):(st.w&&st.r&&parseFloat(st.w)>0);
    if(valid&&(!b||metric(st)>metric(b)))return{w:st.w,r:st.r};
    return b;
  },null);
}
function saveSession(dl,seqIdx){
  const gd=DAYS[seqIdx]||adHocDay||DAYS.find(d=>d.label===dl);
  const s=WS[dl];if(!s||!gd)return;
  const newPRs=[];
  const duration=s.startAt?Math.round((Date.now()-s.startAt)/60000):null;
  const exercises=s.ex.map((ex,ei)=>{
    const orig=gd.ex[ei]||gd.ex[0];
    const isChoiceEx=orig.inputType==='choice';
    const chosenOpt=isChoiceEx&&ex.chosenType?orig.choiceOptions?.find(o=>o.name===ex.chosenType):null;
    const subOverride=(!chosenOpt&&ex.name!==ex.origName)?SUB_TYPE_OVERRIDE[ex.name]:null;
    const effOrig=chosenOpt?{...orig,...chosenOpt,noweight:true}:(subOverride?{...orig,...subOverride}:orig);
    const effName=chosenOpt?ex.chosenType:ex.name;
    const effOrigName=chosenOpt?ex.chosenType:ex.origName;
    const workingSets=ex.sets.filter(st=>!st.isDrop);
    const best=bestSetOf(workingSets,effOrig.inputType);
    const isPR=checkPR(effName,best,effOrig.inputType);
    if(isPR)newPRs.push(effName);
    const exVolume=workingSets.reduce((v,st)=>{
      if(effOrig.inputType==='bodyweight')return v+(parseInt(st.r)||0);
      if(effOrig.inputType==='seconds')return v+(parseFloat(st.w)||0);
      if(effOrig.inputType==='reps_each')return v+(parseInt(st.r)||0)*2;
      return v+(parseFloat(st.w)||0)*(parseInt(st.r)||0);
    },0);
    return{name:effName,origName:effOrigName,best,sets:ex.sets,chosenType:ex.chosenType,suggestion:getSuggestion(effOrig,best,effName),isPR,inputType:effOrig.inputType,exVolume};
  });
  const totalVolume=exercises.reduce((v,e)=>v+(e.exVolume||0),0);
  const isFree=seqIdx==='free';
  const session={date:todayKey(),dl,seqIdx:isFree?null:seqIdx,exercises,note:s.note,painNote:s.painNote||'',skipped:false,duration,newPRs,totalVolume};
  lsS('sess:'+todayKey(),session);
  lsS('last:'+dl,{date:todayKey(),exercises});
  if(!isFree)lsS('last_seq_idx',seqIdx);
  lsS('last_dl',dl);
  const mlog=lsG('mlog:'+monthKey())||{};
  mlog[todayKey()]={type:'done',dl,seqIdx:isFree?undefined:seqIdx};
  lsS('mlog:'+monthKey(),mlog);
  clearDraft();showStickyBtn(false);stopTimerTick();
  const cb=document.getElementById('confbox');
  if(cb){
    cb.style.display='block';
    const prTxt=newPRs.length?' &#x2605; NEW PR: '+newPRs.join(', ')+'!':'';
    cb.innerHTML='&#x2713; Session saved'+(duration?' ('+duration+' min)':'')+'.'+prTxt+' Targets updated.';
    setTimeout(()=>{cb.style.display='none';renderToday();},5000);
  }
}

/* ===== EDIT / SKIP / UNSKIP ===== */
function editSession(){
  if(!confirm('Unlock today\'s session for editing? Current save will be removed.'))return;
  const ex=lsG('sess:'+todayKey());if(!ex||ex.skipped)return;
  const isFree=ex.dl==='Free session';
  const seqIdx=isFree?null:(ex.seqIdx!==undefined&&ex.seqIdx!==null?ex.seqIdx:SEQ.indexOf(ex.dl));
  const gd=isFree?{label:'Free session',focus:'Your combo today',time:'',ex:ex.exercises.map(e=>({n:e.origName,...(findExDef(e.origName)||{}),priority:'must'}))}:(DAYS[seqIdx]||DAYS.find(d=>d.label===ex.dl));
  if(!gd)return;
  WS[ex.dl]={
    ex:ex.exercises.map((e,ei)=>({
      name:e.name,origName:e.origName,chosenType:e.chosenType||null,
      sets:e.sets||[{w:e.best?.w||'',r:e.best?.r||'',done:true,isDrop:false}]
    })),
    subOpen:null,note:ex.note||'',painNote:ex.painNote||'',startAt:Date.now(),lastSetAt:null
  };
  lsDel('sess:'+todayKey());
  const mlog=lsG('mlog:'+monthKey())||{};delete mlog[todayKey()];lsS('mlog:'+monthKey(),mlog);
  if(!isFree)lsS('last_seq_idx',(seqIdx+3)%4);
  adHocDay=gd;adHocSeqIdx=seqIdx;
  saveDraft(ex.dl);
  renderToday();
}

function unskipSession(){
  if(!confirm('Remove skip and show workout?'))return;
  lsDel('sess:'+todayKey());
  const mlog=lsG('mlog:'+monthKey())||{};delete mlog[todayKey()];lsS('mlog:'+monthKey(),mlog);
  renderToday();
}
function skipSession(reason){
  const nextIdx=getNextIdx();
  const gd=adHocDay||(nextIdx!==null?DAYS[nextIdx]:null);
  const dl=gd?gd.label:'Rest day';
  lsS('sess:'+todayKey(),{date:todayKey(),dl,skipped:true,skipReason:reason});
  const mlog=lsG('mlog:'+monthKey())||{};
  mlog[todayKey()]={type:'skip',reason,dl};
  lsS('mlog:'+monthKey(),mlog);
  clearDraft();showStickyBtn(false);stopTimerTick();
  const ss=document.getElementById('skipsheet');if(ss)ss.style.display='none';
  renderToday();
}

/* ===== BACKUP + EXPORT + IMPORT ===== */
function exportData(){
  const all={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&!k.startsWith('ws_draft:'))all[k]=lsG(k);}
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='roshan-fitness-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  lsS('last_export',todayKey());renderProgress();
}
function shareBackup(){
  const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);data[k]=localStorage.getItem(k);}
  const file=new File([JSON.stringify(data)],'roshan-fitness-'+todayKey()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Fitness backup '+todayKey()}).then(()=>{lsS('last_export',todayKey());renderProgress();}).catch(()=>{});

}

function gastroExport(){
  const stats=(lsG('bstats')||[]).filter(s=>s.wt||s.bf);
  const first=stats[0],latest=stats[stats.length-1];
  const cutoff28=(()=>{const d=new Date();d.setDate(d.getDate()-28);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  const recentStats=stats.filter(s=>s.date>=cutoff28);
  let rateLine='Not enough data yet';
  if(recentStats.length>=2){
    const withWt=recentStats.filter(s=>s.wt);
    const mid=Math.ceil(withWt.length/2);
    const firstHalf=withWt.slice(0,mid),secondHalf=withWt.slice(mid).length?withWt.slice(mid):withWt.slice(-1);
    const avgA=firstHalf.reduce((s,e)=>s+parseFloat(e.wt),0)/firstHalf.length;
    const avgB=secondHalf.reduce((s,e)=>s+parseFloat(e.wt),0)/secondHalf.length;
    const days=(new Date(withWt[withWt.length-1].date)-new Date(withWt[0].date))/86400000;
    if(days>0&&withWt.length>=2){
      const pctPerWeek=(((avgA-avgB)/avgA)*100)/(days/7);
      rateLine=pctPerWeek.toFixed(2)+'% per week (smoothed)'+(Math.abs(pctPerWeek)>0.75?' \u2014 ABOVE 0.75% threshold, flag to gastro':'');
    }
  }
  const entries=Object.entries(mergedMlog()).filter(([k])=>k>=cutoff28).map(e=>e[1]);
  const done=entries.filter(e=>e.type==='done').length;
  const flareSkips=entries.filter(e=>e.type==='skip'&&e.reason==='flare').length;
  const planned=entries.length;
  let energySum=0,energyN=0,bowelNormal=0,bowelOff=0,setonConcern=0,symN=0;
  for(let i=0;i<28;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const s=lsG('sym:'+k);if(!s)continue;symN++;
    if(s.energy){energySum+=parseInt(s.energy);energyN++;}
    if(s.bowel==='normal')bowelNormal++;else if(s.bowel)bowelOff++;
    if(s.seton==='concerning')setonConcern++;
  }
  const avgEnergy=energyN?(energySum/energyN).toFixed(1):'\u2014';
  const text='ROSHAN ARASU \u2014 GASTRO SUMMARY ('+todayKey()+')\n\n'
    +'WEIGHT & BODY COMPOSITION\n'
    +'  Start on record: '+(first?first.wt+'kg / '+(first.bf||'\u2014')+'% BF ('+first.date+')':'No data')+'\n'
    +'  Current: '+(latest?latest.wt+'kg / '+(latest.bf||'\u2014')+'% BF ('+latest.date+')':'No data')+'\n'
    +'  Rate, last 4 weeks: '+rateLine+'\n\n'
    +'TRAINING (last 4 weeks)\n'
    +'  Sessions completed: '+done+' of '+planned+' logged days\n'
    +'  Symptom-triggered rest days: '+flareSkips+'\n\n'
    +'SYMPTOMS (last 4 weeks, '+symN+' days logged)\n'
    +'  Average energy: '+avgEnergy+'/5\n'
    +'  Bowel: '+bowelNormal+' days normal, '+bowelOff+' days off\n'
    +'  Seton \u2014 concerning drainage logged on '+setonConcern+' day(s)\n\n'
    +'QUESTIONS FOR THIS APPOINTMENT\n'
    +'  - B12: currently oral \u2014 is sublingual or IM better absorbed for terminal ileum disease?\n'
    +'  - Vitamin D: Sheffield latitude + malabsorption risk \u2014 worth testing?\n'
    +'  - Infliximab + azathioprine combination: what\'s an actual safe alcohol limit for me, and how does that interact with the LFT monitoring schedule?\n'
    +'  - Seton: does axial loading / bracing under load / deep hip flexion pose a specific risk here \u2014 does that include machine-guided squat variations (e.g. leverage/hack squat), not just free squats?\n';
  if(navigator.canShare&&navigator.canShare({text})){
    navigator.share({title:'Gastro summary '+todayKey(),text}).catch(()=>showTextModal('Gastro summary',text));
  }else{showTextModal('Gastro summary',text);}
}
const APP_VERSION='v2.2j';
function checkUpdate(){
  if(!navigator.onLine)return;
  fetch('https://arasroshan-cell.github.io/Fitness/index.html',{cache:'no-store'}).then(r=>r.text()).then(txt=>{
    const m=txt.match(/Roshan Fitness (v[\d.]+[a-z]?)/);
    if(m&&m[1]!==APP_VERSION){
      document.body.insertAdjacentHTML('afterbegin','<div style="position:relative;z-index:999;background:var(--abg);color:var(--amb);font-size:13px;font-weight:700;padding:9px 14px;text-align:center">'+m[1]+' is live but this device runs '+APP_VERSION+' \u2014 clear cached files (not site data) in browser settings, then reload.</div>');
    }
  }).catch(()=>{});
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(!confirm('REPLACE all current data with this backup?'))return;
    try{const data=JSON.parse(e.target.result);localStorage.clear();Object.entries(data).forEach(([k,v])=>lsS(k,v));alert('Restored. Reloading.');location.reload();}
    catch{alert('Could not read backup file.');}
  };
  reader.readAsText(file);input.value='';
}

let timerInterval=null;
function getElapsed(ts){if(!ts)return null;const s=Math.floor((Date.now()-ts)/1000);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s';}
function startTimerTick(){
  stopTimerTick();

    const gd=adHocDay||DAYS[getNextIdx()];if(!gd)return;

  },5000);
}

let _wxCache={temp:null,ts:0};
async function fetchWeather(){
  if(_wxCache.temp!==null&&Date.now()-_wxCache.ts<1800000)return _wxCache.temp;
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=temperature_2m&timezone=Europe%2FLondon&forecast_days=1',{signal:AbortSignal.timeout(3000)});
    const d=await r.json();_wxCache={temp:Math.round(d.current.temperature_2m),ts:Date.now()};return _wxCache.temp;
  }catch{return _wxCache.temp;}
}

    // Render exercises grouped by must/optional
    function renderEx(ex,ei){
      const orig=gd.ex[ei];
      const isChoice=orig.inputType==='choice';
      const chosenOpt=isChoice&&ex.chosenType?orig.choiceOptions?.find(o=>o.name===ex.chosenType):null;
      const trackName=chosenOpt?ex.chosenType:ex.name;
      const lx=last?.exercises?.find(l=>l.name===trackName);
      const subOverride=(!chosenOpt&&ex.name!==ex.origName)?SUB_TYPE_OVERRIDE[ex.name]:null;
      const subWlabel=subOverride?.wlabel||((!chosenOpt&&ex.name!==ex.origName)?inferSubWlabel(ex.name):null);
      const effType=chosenOpt?chosenOpt.inputType:(subOverride?subOverride.inputType:(orig.inputType||'weight'));
      const effR=chosenOpt?chosenOpt.r:orig.r;
      const fmtBest=(b)=>!b?'':(effType==='seconds'?b.w+'s':effType==='reps_each'?b.w+' each side':b.w+'kg \u00d7 '+b.r);
      const histFall=(!lx?.best)?(getExHistory(trackName).slice(-1)[0]||null):null;
      const lstr=lx?.best?'Last: '+fmtBest(lx.best):histFall?'Last ('+histFall.date.slice(5)+'): '+fmtBest(histFall.best):'First time';
      const effOrigLike=chosenOpt?{...orig,...chosenOpt,noweight:true}:(subOverride?{...orig,...subOverride}:orig);
      const bestForSugg=lx?.best||histFall?.best||null;
      const sugg=bestForSugg?getSuggestion(effOrigLike,bestForSugg,trackName):'';
      const allDone=ex.sets.filter(s=>!s.isDrop).every(s=>s.done);
      const isSubbed=ex.name!==ex.origName;
      const subOpen=ws.subOpen===ei;
      const subs=SUBS[ex.origName]||[];
      const cid='ci'+ei;
      const prData=lsG('pr:'+trackName);
      let h=`<div class="exb">
        <div class="exhd">
          <div>
            <div class="exn${allDone?' done':''}">${ex.name}${allDone?' &#x2713;':''} <span class="pill ${orig.priority==='must'?'pr':'pd'}">${orig.priority==='must'?'MUST':'OPTIONAL'}</span></div>
            ${isSubbed?`<div class="subbed">SUB for ${ex.origName}</div>`:''}

            <div class="ext">${orig.s} sets &times; ${effR||orig.r}</div>

          </div>
          <div style="text-align:right;flex-shrink:0"><div class="exlast">${lstr}</div>${sugg?`<div class="exsugg">${sugg}</div>`:''}</div>
        </div>`;
      // Choice picker
      if(isChoice&&!ex.chosenType){
        h+=`<div class="choice-pick">${orig.choiceOptions.map(o=>`<button class="choice-btn" onclick="chooseExType('${gd.label}',${ei},'${o.name}')">${o.name}<div style="font-size:11px;margin-top:4px;color:var(--mut)">${o.r}</div></button>`).join('')}</div>`;
      }
      if(!isChoice||ex.chosenType){
        ex.sets.forEach((set,si)=>{
          const isDrop=set.isDrop;
          const isExtra=isDrop||si>=(orig.s||3);
          h+=`<div class="srow${set.done?' setdone':''}${isDrop?' droprow':''}"${si===ex.sets.length-1&&!subOpen?' style="border-bottom:none"':''}>
            <div class="snum">${isDrop?`S${si+1}<span class="dbadge">DROP</span>`:`S${si+1}`}${isExtra?`<button class="setdel" onclick="removeSet('${gd.label}',${ei},${si})" title="Remove this set">&#x2715;</button>`:''}</div>
            <div style="text-align:center">
              <input class="nin" type="number" inputmode="decimal" placeholder="${effType==='seconds'?'sec':effType==='reps_each'?'reps':'kg'}" min="0" step="${effType==='weight'?0.5:1}" value="${set.w}" oninput="updSet('${gd.label}',${ei},${si},'w',this.value)">
              <div class="nin-lbl">${effType==='seconds'?'sec':effType==='reps_each'?'/side':'kg'}</div>
            </div>
            ${(effType!=='seconds'&&effType!=='reps_each')?`<span class="tx">&times;</span><div style="text-align:center"><input class="nin" type="number" inputmode="numeric" placeholder="reps" min="0" step="1" value="${set.r}" oninput="updSet('${gd.label}',${ei},${si},'r',this.value)"><div class="nin-lbl">reps</div></div>`:''}
            <button class="dbtn${set.done?' dk':''}" onclick="togDone('${gd.label}',${ei},${si})">${set.done?'&#x2713;':'&#x25CB;'}</button>
          </div>`;
        });
      }
      h+=`<div class="set-actions">
        <button class="subbtn" onclick="togSub('${gd.label}',${ei})">${subOpen?'&#x2715; Close':'&#x21C4; Sub'}</button>
        ${isSubbed?`<button class="subbtn" onclick="resetSub('${gd.label}',${ei})">&#x21A9; Original</button>`:''}
        <button class="addbtn" onclick="addSet('${gd.label}',${ei})">+ Set</button>
        <button class="dropbtn" onclick="addDropSet('${gd.label}',${ei})">&#x2193; Drop</button>
      </div>`;
      if(subOpen){
        h+=`<div class="subpanel">
          <div style="font-size:11px;color:var(--mut);margin-bottom:8px;font-weight:700">Subs for ${ex.origName}:</div>
          ${subs.map(s=>`<button class="subopt" onclick="pickSub('${gd.label}',${ei},'${s.replace(/'/g,"\\'")}')">&#x2192; ${s}</button>`).join('')}
          <div style="font-size:11px;color:var(--mut);margin:8px 0 4px;font-weight:700">Type your own:</div>
          <input class="genin" type="text" id="${cid}" placeholder="Custom exercise..."
            onkeydown="if(event.key==='Enter'){applyCSub('${gd.label}',${ei},'${cid}');event.preventDefault()}">
          <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="applyCSub('${gd.label}',${ei},'${cid}')">Use this</button>
        </div>`;
      }
      h+=`</div>`;
      return h;
    }

    if(gd.label==='Free session'){
      const exList=getFreeSessionExerciseList();
      html+=`<div class="card" style="margin-bottom:12px">
        <div class="cl">Add an exercise</div>
        <input class="genin" id="free-ex-search" placeholder="Search exercises..." oninput="filterFreeExList(this.value)" style="margin:8px 0">
        <div id="free-ex-list" style="max-height:180px;overflow-y:auto">
          ${exList.map(e=>`<div class="free-ex-row" data-name="${e.n.toLowerCase()}" onclick="addToFreeSession('${e.n.replace(/'/g,"\\'")}')">
            <span>${e.n}${e.subOf?`<span style="color:var(--dim);font-size:11px"> &middot; sub for ${e.subOf}</span>`:''}</span><span style="color:var(--cyan);font-size:18px">+</span>
          </div>`).join('')}
        </div>
      </div>`;
      if(!gd.ex.length){
        html+=`<div class="cs" style="text-align:center;padding:20px 0">No exercises added yet \u2014 search above to build today's session.</div>`;
      }
      gd.ex.forEach((e,ei)=>{
        html+=`<div style="position:relative">${renderEx(ws.ex[ei],ei)}<button class="setdel" style="position:absolute;top:14px;right:14px;width:auto" onclick="removeFromFreeSession(${ei})">Remove exercise</button></div>`;
      });
    }else{
      html+=`<div class="sect-div"><div class="sect-lbl must">Must do</div><div class="sect-line"></div></div>`;
      gd.ex.forEach((e,ei)=>{if(e.priority==='must')html+=renderEx(ws.ex[ei],ei);});
    const optExist=gd.ex.some(e=>e.priority!=='must');
    if(optExist){
      html+=`<div class="sect-div"><div class="sect-lbl opt">If got time</div><div class="sect-line"></div></div>`;
      gd.ex.forEach((e,ei)=>{if(e.priority!=='must')html+=`<div style="opacity:.85">${renderEx(ws.ex[ei],ei)}</div>`;});
    }
    }

    const mustList=ws.ex.filter((e,i)=>gd.ex[i].priority==='must');
    const optList=ws.ex.filter((e,i)=>gd.ex[i].priority!=='must');
    const isDone=e=>e.sets.filter(s=>!s.isDrop).every(s=>s.done)&&e.sets.filter(s=>!s.isDrop).length>0;
    const mustDone=mustList.filter(isDone).length;
    const optDone=optList.filter(isDone).length;
    html+=`<div class="sep"></div>
      <div style="font-size:11px;color:var(--mut);margin-bottom:6px;font-weight:700;letter-spacing:1px;text-transform:uppercase">Session notes</div>
      <textarea class="genin" rows="2" placeholder="e.g. felt strong, good energy..." oninput="if(WS['${gd.label}']){WS['${gd.label}'].note=this.value;saveDraft('${gd.label}')}">${escHtml(ws.note)}</textarea>
      <div style="font-size:11px;color:var(--mut);margin:10px 0 6px;font-weight:700;letter-spacing:1px;text-transform:uppercase">Pain / joint (optional)</div>
      <textarea class="genin" rows="1" placeholder="e.g. shoulder twinge on bench, left knee..." oninput="if(WS['${gd.label}']){WS['${gd.label}'].painNote=this.value;saveDraft('${gd.label}')}">${escHtml(ws.painNote)}</textarea>
      <div style="display:flex;justify-content:space-between;margin:12px 0 5px">
        <div style="font-size:13px;color:var(--red);font-weight:700">Must: ${mustDone}/${mustList.length} done</div>
        <div style="font-size:13px;color:var(--dim);font-weight:700">Optional: ${optDone}/${optList.length} done</div>
      </div>
      <div class="prog-bar" style="margin-bottom:6px"><div class="prog-fill" style="width:${mustList.length?Math.round(mustDone/mustList.length*100):100}%;background:var(--red)"></div></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${optList.length?Math.round(optDone/optList.length*100):100}%;background:var(--dim)"></div></div>
    </div>
    <div id="confbox" class="confbox"></div>
    <button class="btn btn-ghost" onclick="document.getElementById('skipsheet').style.display='block'" style="margin-top:6px">Skip today</button>
    <div class="skipsheet" id="skipsheet">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--mut)">Why skipping?</div>
      <button class="skipopt" onclick="skipSession('flare')">Flare day</button>
      <button class="skipopt" onclick="skipSession('tired')">Too tired</button>
      <button class="skipopt" onclick="skipSession('busy')">Too busy</button>
      <button class="skipopt" style="color:var(--mut);font-weight:500" onclick="document.getElementById('skipsheet').style.display='none'">Cancel</button>
    </div>`;
    showStickyBtn(true,gd.label,seqIdx);
    startTimerTick();
  }

  /* -- Weather placeholder (filled async after DOM write) -- */
  html+=`<div id="wx-slot"></div>`;

  /* -- Water -- */
  const wp=Math.min(water/8*100,100);
  html+=`<div class="card" style="margin-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div><div class="cl">Water</div><div style="font-size:13px;color:var(--mut)">8 glasses target</div></div>
      ${water>=8?`<span class="pill pg">&#x2713; Done</span>`:''}
    </div>
    <div class="water-row">
      <button class="water-btn" onclick="adjWater(-1)">&minus;</button>
      <div style="text-align:center"><div id="water-num" class="water-count${water>=8?' full':''}">${water}</div><div style="font-size:10px;color:var(--mut);font-weight:600">glasses</div></div>
      <button class="water-btn" onclick="adjWater(1)">+</button>
    </div>
    <div class="prog-bar" style="margin-top:8px"><div id="water-bar" class="prog-fill" style="width:${wp}%;background:var(--cyan)"></div></div>
  </div>`;

  document.getElementById('p0').innerHTML=html;
  injectWeather();
}

function startSession(dayIndex){
  if(dayIndex===-1){_forcePickerOnce=true;adHocDay=null;adHocSeqIdx=null;renderToday();return;}
  _forcePickerOnce=false;
  adHocDay=DAYS[dayIndex];adHocSeqIdx=dayIndex;
  initWS(adHocDay.label,adHocDay);
  renderToday();
}
function startFreeSession(){
  _forcePickerOnce=false;
  adHocDay={label:'Free session',focus:'Your combo today',time:'',ex:[]};
  adHocSeqIdx=null;
  WS['Free session']={ex:[],subOpen:null,note:'',painNote:'',startAt:Date.now(),lastSetAt:null};
  saveDraft('Free session');
  renderToday();
}
function getFreeSessionExerciseList(){
  const seen=new Set();const list=[];
  for(const d of DAYS){for(const e of d.ex){
    if(e.inputType==='choice'&&e.choiceOptions){
      for(const o of e.choiceOptions){
        if(!seen.has(o.name)){seen.add(o.name);list.push({...e,...o,n:o.name});}
      }
    }else if(!seen.has(e.n)){seen.add(e.n);list.push(e);}
  }}
  for(const origName in SUBS){
    for(const subName of SUBS[origName]){
      if(seen.has(subName))continue;
      seen.add(subName);
      const def=findExDef(subName);
      if(def)list.push(def);
    }
  }
  return list.sort((a,b)=>a.n.localeCompare(b.n));
}
function addToFreeSession(name){
  if(!adHocDay||adHocDay.label!=='Free session')return;
  const def=getFreeSessionExerciseList().find(e=>e.n===name);
  if(!def)return;
  adHocDay.ex.push({...def,priority:'must'});
  const pSubs=lsG('persisted_subs')||{};
  WS['Free session'].ex.push({
    name:pSubs[def.n]||def.n,origName:def.n,chosenType:null,
    sets:Array.from({length:def.s||3},()=>({w:'',r:'',done:false,isDrop:false}))
  });
  saveDraft('Free session');
  renderToday();
}
function filterFreeExList(q){
  const query=q.toLowerCase();
  document.querySelectorAll('.free-ex-row').forEach(row=>{
    row.style.display=row.dataset.name.includes(query)?'flex':'none';
  });
}
function removeFromFreeSession(ei){
  if(!adHocDay||adHocDay.label!=='Free session')return;
  adHocDay.ex.splice(ei,1);
  WS['Free session'].ex.splice(ei,1);
  saveDraft('Free session');
  renderToday();
}
/* ===== RENDER PROGRESS ===== */
function renderProgress(){
  const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-28);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  const entries=Object.entries(mergedMlog()).filter(([k])=>k>=cutoff).map(e=>e[1]);
  const done=entries.filter(e=>e.type==='done').length;
  const flare=entries.filter(e=>e.type==='skip'&&e.reason==='flare').length;
  const miss=entries.filter(e=>e.type==='skip'&&e.reason!=='flare').length;
  const total=done+flare+miss;
  const score=total>0?Math.round((done+flare*0.5)/total*100):0;
  const scoreCol=score>=80?'var(--grn)':score>=60?'var(--amb)':'var(--red)';
  const stats=lsG('bstats')||[];const latest=stats[stats.length-1];

    <div class="pstat"><div class="pval" style="color:${miss>0?'var(--red)':'var(--cyan)'}">${miss}</div><div class="plbl">missed</div></div>

function saveStats(){
  const entry={date:todayKey()};
  ['wt','bf','mm','bw'].forEach(f=>{const v=document.getElementById('st_'+f)?.value;if(v)entry[f]=parseFloat(v);});
  if(!entry.wt&&!entry.bf)return;
  // Auto-calculate fat mass — no manual entry
  if(entry.wt&&entry.bf)entry.fm=Math.round(entry.wt*entry.bf/100*10)/10;
  // Tag body water as kg going forward
  if(entry.bw)entry.bwUnit='kg';
  const all=lsG('bstats')||[];all.push(entry);lsS('bstats',all.slice(-260));
  updateHeader();const c=document.getElementById('stconf');if(c){c.style.display='block';setTimeout(()=>{c.style.display='none';renderProgress();},2000);}
}
function saveMeasurements(){
  const entry={date:todayKey()};
  const map={mw:'waist',mc:'chest',mla:'lArm',mra:'rArm'};
  Object.entries(map).forEach(([id,key])=>{const v=document.getElementById(id)?.value;if(v)entry[key]=parseFloat(v);});
  if(!entry.waist&&!entry.chest)return;
  const all=lsG('measurements')||[];all.push(entry);lsS('measurements',all.slice(-260));
  const c=document.getElementById('mconf');if(c){c.style.display='block';setTimeout(()=>{c.style.display='none';renderProgress();},2000);}
}

function allFoods(){const c=lsG('custom_foods')||[];return[...FOODS,...c.map(f=>({...f,cat:'My foods'}))];}
function foodOptsHtml(){
  const cats={};allFoods().forEach(f=>{if(!cats[f.cat])cats[f.cat]=[];cats[f.cat].push(f);});
  return Object.entries(cats).map(([cat,items])=>`<optgroup label="${cat}">${items.map(f=>`<option value="${f.name}">${f.name}${f.fibreRisk?' \u26A0':''}${f.lbl?' ('+f.lbl+')':''}</option>`).join('')}</optgroup>`).join('');
}
/* Unit-aware amount handling. 'g' and 'ml' foods are entered as a direct amount
   (prefilled to the food's typical serving, editable). 'piece'/'tsp'/'scoop' foods
   are entered as a count (prefilled to 1, editable), and typ on that food record
   stores grams-per-unit so the count can be converted into real macros. */
const COUNT_UNITS={piece:'pieces',tsp:'tsp',scoop:'scoops'};
function isCountUnit(u){return!!COUNT_UNITS[u];}
function unitWord(u){return COUNT_UNITS[u]||u||'g';}
function defaultAmt(food){return isCountUnit(food.unit)?1:(food.typ||100);}
function amtFieldLabel(food){return isCountUnit(food.unit)?'Quantity ('+unitWord(food.unit)+')':'Amount ('+(food.unit||'g')+')';}
function foodMacros(food,amt){
  if(!food||!amt)return{k:0,p:0,c:0,f:0};
  const grams=isCountUnit(food.unit)?amt*(food.typ||100):amt;
  return{k:food.per100.k*grams/100,p:food.per100.p*grams/100,c:food.per100.c*grams/100,f:food.per100.f*grams/100};
}

function renderMealGroups(log){
  if(!log.length)return`<div style="font-size:14px;color:var(--dim);text-align:center;padding:16px">No meals logged yet</div>`;
  const groups={};
  MEAL_TYPES.forEach(m=>groups[m]=[]);
  groups['Other']=[];
  log.forEach((item,i)=>{
    const g=MEAL_TYPES.includes(item.mealType)?item.mealType:'Other';
    groups[g].push({...item,i});
  });
  let html='';
  [...MEAL_TYPES,'Other'].forEach(mealType=>{
    const items=groups[mealType];
    if(!items.length)return;
    const mK=Math.round(items.reduce((s,i)=>s+(i.k||0),0));
    const mP=Math.round(items.reduce((s,i)=>s+(i.p||0),0));
    html+=`<div class="meal-group">
      <div class="meal-hd">
        <div class="meal-hd-name">${mealType}</div>
        <div class="meal-hd-totals">${mK} kcal &middot; ${mP}g protein</div>
      </div>
      ${items.map(item=>`<div class="meal-item">
        <div style="flex:1">
          <div class="meal-item-name">${item.name}</div>
          <div class="meal-item-meta">${item.amt?item.amt+' '+(item.unit||'g')+' &middot; ':''} ${Math.round(item.k||0)} kcal &middot; ${Math.round(item.p||0)}g${item.time?' &middot; '+item.time:''}</div>

      </div>`).join('')}
    </div>`;
  });
  return html;
}

function computePlate(){
  const foods=allFoods();
  const components=[{id:'base',amtId:'pc-base-amt'},{id:'liq',amtId:'pc-liq-amt'},{id:'pro',amtId:'pc-pro-amt'},{id:'side',amtId:'pc-side-amt'}];
  let totalK=0,totalP=0,totalC=0,totalF=0,names=[];const breakdown=[];
  components.forEach(c=>{
    const sel=document.getElementById('pc-'+c.id);const amt=parseFloat(document.getElementById(c.amtId)?.value)||0;
    if(!sel||!sel.value||!amt)return;
    const food=foods.find(f=>f.name===sel.value);if(!food)return;
    const m=foodMacros(food,amt);
    totalK+=m.k;totalP+=m.p;totalC+=m.c;totalF+=m.f;names.push(food.name);
    const unitTxt=isCountUnit(food.unit)?(amt+' '+unitWord(food.unit)):(amt+(food.unit||'g'));
    breakdown.push(`<div class="macrow"><span style="color:var(--mut)">${food.name} ${unitTxt}</span><span class="macval">${Math.round(m.k)} kcal &middot; ${m.p.toFixed(1)}g</span></div>`);
  });
  return{totalK,totalP,totalC,totalF,names,breakdown};
}
function buildPlate(){

function buildSVG(points,color,unit){
  if(!points||points.length<2)return'<div style="color:var(--dim);font-size:13px;padding:20px;text-align:center">Need at least 2 entries to show a trend</div>';
  const vals=points.map(p=>p.y);
  const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const W=320,H=100,pad=8;
  const biol=lsG('biologic_date');
  const px=i=>pad+(i/(points.length-1))*(W-pad*2);
  const py=y=>pad+(H-pad*2)-((y-mn)/range)*(H-pad*2);
  const polyPts=points.map((p,i)=>px(i)+','+py(p.y)).join(' ');
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible">
    <polyline points="${polyPts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${points.map((p,i)=>{
      const x=px(i),y=py(p.y);
      const isPR=p.pr;
      return`<circle cx="${x}" cy="${y}" r="${isPR?5:3}" fill="${isPR?'var(--gold)':color}" stroke="${isPR?color:'none'}" stroke-width="1.5"/>`;
    }).join('')}
    <text x="${pad}" y="${H}" fill="var(--dim)" font-size="9">${points[0].label}</text>
    <text x="${W-pad}" y="${H}" fill="var(--dim)" font-size="9" text-anchor="end">${points[points.length-1].label}</text>
    <text x="${pad}" y="11" fill="${color}" font-size="10" font-weight="bold">${mx.toFixed(1)}${unit}</text>
    <text x="${pad}" y="${H-10}" fill="${color}" font-size="10">${mn.toFixed(1)}${unit}</text>
    ${biol?`<line x1="${(()=>{const idx=points.findIndex(p=>p.date>=biol);return idx>=0?px(idx):px(points.length-1)})()}" y1="${pad}" x2="${(()=>{const idx=points.findIndex(p=>p.date>=biol);return idx>=0?px(idx):px(points.length-1)})()}" y2="${H-pad}" stroke="var(--amb)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="${(()=>{const idx=points.findIndex(p=>p.date>=biol);return idx>=0?px(idx)+3:px(points.length-1)+3})()}" y="${pad+10}" fill="var(--amb)" font-size="9">Biol.</text>`:''}
  </svg>`;
  return svg;
}

function getExHistory(name){
  const results=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('sess:'))continue;
    const sess=lsG(k);
    if(!sess||sess.skipped||!sess.exercises)continue;
    const ex=sess.exercises.find(e=>e.name===name);
    if(!ex||!ex.best||!ex.best.w)continue;
    results.push({date:sess.date,dl:sess.dl,best:ex.best,isPR:ex.isPR||false,suggestion:ex.suggestion||''});
  }
  return results.sort((a,b)=>a.date.localeCompare(b.date));
}

function renderHistory(){
  const stats=lsG('bstats')||[];
  const measurements=lsG('measurements')||[];
  const biol=lsG('biologic_date')||'';
  const now=new Date();

  // Helper: local date key for a Date object
  function localKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

  // Last 7 days for week snapshot
  let weekSessions=0,weekProtein=[],weekKcal=[];
  for(let d=6;d>=0;d--){
    const dt=new Date(now);dt.setDate(dt.getDate()-d);
    const key=localKey(dt);
    const sess=lsG('sess:'+key);
    if(sess&&!sess.skipped)weekSessions++;
    const log=lsG('food:'+key)||[];
    if(log.length){
      weekProtein.push(Math.round(log.reduce((s,i)=>s+(i.p||0),0)));
      weekKcal.push(Math.round(log.reduce((s,i)=>s+(i.k||0),0)));
    }
  }
  const avgP=weekProtein.length?Math.round(weekProtein.reduce((a,b)=>a+b,0)/weekProtein.length):0;
  const avgK=weekKcal.length?Math.round(weekKcal.reduce((a,b)=>a+b,0)/weekKcal.length):0;
  const restDays=7-weekSessions;

  // Food 14-day data
  const foodWeek=[];
  for(let d=13;d>=0;d--){
    const dt=new Date(now);dt.setDate(dt.getDate()-d);
    const key=localKey(dt);
    const log=lsG('food:'+key)||[];
    const p=Math.round(log.reduce((s,i)=>s+(i.p||0),0));
    const k=Math.round(log.reduce((s,i)=>s+(i.k||0),0));
    const dayName=['Su','Mo','Tu','We','Th','Fr','Sa'][dt.getDay()];
    const dateNum=String(dt.getDate()).padStart(2,'0');
    foodWeek.push({key,label:dayName+'\n'+dateNum,p,k,hasData:log.length>0});

  // All exercises ever done

  let html='';

  // 1. WEEK SNAPSHOT (top — most used)

    <div class="cl">This week</div>

        <div style="font-size:10px;color:var(--mut);font-weight:600;margin-top:2px">SESSIONS</div>
      </div>
      <div style="background:var(--c2);border:1px solid var(--c3);border-radius:12px;padding:10px;text-align:center">
        <div style="font-size:22px;font-weight:900;font-family:'Barlow',sans-serif;color:${avgP>=130?'var(--grn)':avgP>=90?'var(--amb)':'var(--red)'}">${avgP}<span style="font-size:12px;font-weight:400;color:var(--mut)">g</span></div>
        <div style="font-size:10px;color:var(--mut);font-weight:600;margin-top:2px">AVG PROTEIN</div>
      </div>
      <div style="background:var(--c2);border:1px solid var(--c3);border-radius:12px;padding:10px;text-align:center">
        <div style="font-size:22px;font-weight:900;font-family:'Barlow',sans-serif;color:var(--cyan)">${avgK}</div>

      <div style="background:var(--c2);border:1px solid var(--c3);border-radius:12px;padding:10px;text-align:center">
        <div style="font-size:22px;font-weight:900;font-family:'Barlow',sans-serif;color:var(--mut)">${restDays}</div>
        <div style="font-size:10px;color:var(--mut);font-weight:600;margin-top:2px">REST DAYS</div>

    ${avgP>0&&avgP<getProfile().targets.protein*0.87?`<div style="font-size:12px;color:var(--amb);margin-top:10px">&#x25B2; Avg protein ${getProfile().targets.protein-avgP}g/day below target &mdash; prioritise protein at every meal</div>`:''}

  // 2. BODY TRENDS

      <div class="cl">Body trends</div>
      <div class="ct" style="margin-bottom:12px">Weight &amp; body fat over time</div>
      <div class="chart-wrap"><div class="chart-label">Weight (kg)</div>${buildSVG(wtPts,'var(--cyan)','kg')}</div>
      ${bfPts.length>=2?`<div class="chart-wrap"><div class="chart-label">Body fat (%)</div>${buildSVG(bfPts,'var(--amb)','%')}</div>`:''}
    </div>`;
  }else{
    html+=`<div class="card"><div class="cl">Body trends</div><div class="nt ni">Log body stats in Progress at least twice to see trends.</div></div>`;
  }

  // 3. FOOD 14-DAY CHART
  html+=`<div class="card">
    <div class="cl">Nutrition &mdash; last 14 days</div>
    <div class="ct" style="margin-bottom:10px">Tap a day to see the full breakdown</div>
    <div class="day-strip">
      ${foodWeek.map(d=>{
        const col=!d.hasData?'var(--dim)':d.p>=150?'var(--grn)':d.p>=100?'var(--amb)':'var(--red)';
        return`<div class="day-pill" onclick="showDayFood('${d.key}')">
          <div class="day-pill-name">${d.label.split('\n')[0]}<br>${d.label.split('\n')[1]}</div>
          <div class="day-pill-val" style="color:${col}">${d.hasData?d.p+'g':'&mdash;'}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:12px;font-size:11px;font-weight:700;margin-bottom:10px">
      <span style="color:var(--grn)">&#x2588; 150g+</span>
      <span style="color:var(--amb)">&#x2588; 100&ndash;149g</span>
      <span style="color:var(--red)">&#x2588; under 100g</span>
    </div>
    <div id="day-food-detail"></div>
  </div>`;

  // 4. EXERCISE HISTORY SEARCH
  html+=`<div class="card">
    <div class="cl">Exercise history</div>
    <div class="ct" style="margin-bottom:10px">Search any exercise &mdash; every session, best set, PRs</div>
    <input class="ex-search" type="text" id="ex-search-input" placeholder="e.g. Pull-ups, Bench press..." oninput="searchExHistory(this.value)">
    <div id="ex-history-result">
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${[...allExNames].slice(0,12).map(n=>`<button onclick="document.getElementById('ex-search-input').value='${n}';searchExHistory('${n}')" style="padding:6px 12px;border:1px solid var(--c3);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--c2);color:var(--mut);font-family:inherit">${n}</button>`).join('')}
      </div>
      ${allExNames.size===0?`<div style="font-size:13px;color:var(--dim);padding:12px">No sessions logged yet.</div>`:''}
    </div>
  </div>`;

  // 5. WAIST TREND
  if(measurements.length>=2){
    const wstPts=measurements.filter(m=>m.waist).slice(-12).map(m=>({y:parseFloat(m.waist),label:m.date?.slice(5)||'',date:m.date}));
    if(wstPts.length>=2)html+=`<div class="card"><div class="cl">Waist trend (cm)</div><div class="chart-wrap">${buildSVG(wstPts,'var(--grn)','cm')}</div></div>`;
  }

  // 6. BIOLOGIC DATE — collapsed, set once
  html+=`<div class="card" style="margin-bottom:12px">
    <div class="cl">Biologic milestone</div>
    <div class="cs" style="margin-bottom:10px">Set once. Appears as a marker on all charts.</div>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="date" id="biol-date" value="${biol}" class="sinput" style="flex:1" onchange="saveBiol()">
      ${biol?`<span style="font-size:12px;color:var(--grn);font-weight:700">&#x2713; Set</span>`:''}
    </div>
    ${biol?`<div class="nt ni" style="margin-top:8px">Biologics start: ${biol}</div>`:''}
  </div>`;

  document.getElementById('p3').innerHTML=html;
}

function showDayFood(dateKey){
  const log=lsG('food:'+dateKey)||[];
  const el=document.getElementById('day-food-detail');
  if(!el)return;
  if(!log.length){el.innerHTML=`<div style="font-size:13px;color:var(--dim);padding:8px">Nothing logged for ${dateKey}</div>`;return;}
  const totalK=Math.round(log.reduce((s,i)=>s+(i.k||0),0));
  const totalP=Math.round(log.reduce((s,i)=>s+(i.p||0),0));
  const totalC=Math.round(log.reduce((s,i)=>s+(i.c||0),0));
  const totalF=Math.round(log.reduce((s,i)=>s+(i.f||0),0));
  el.innerHTML=`<div style="background:var(--c2);border-radius:12px;padding:12px;border:1px solid var(--cbr)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700">${dateKey}</div>
      <div style="text-align:right"><div style="font-size:14px;font-weight:800;font-family:'Barlow',sans-serif;color:var(--cyan)">${totalP}g protein &middot; ${totalK} kcal</div>${totalC>0?`<div style="font-size:11px;color:var(--mut)">${totalC}g carbs &middot; ${totalF}g fat</div>`:''}</div>
    </div>
    ${log.map(item=>`<div class="hist-ex-row">
      <div><div class="meal-item-name">${item.name}</div><div class="meal-item-meta">${item.mealType||''}${item.amt?' &middot; '+item.amt+' '+(item.unit||'g'):''}</div></div>
      <div style="text-align:right;font-size:12px;color:var(--mut)">${Math.round(item.k||0)} kcal &middot; ${Math.round(item.p||0)}g</div>
    </div>`).join('')}
  </div>`;
}

function searchExHistory(query){
  const el=document.getElementById('ex-history-result');if(!el||!query.trim())return;
  const q=query.trim().toLowerCase();
  const allNames=new Set();
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('sess:'))continue;
    const sess=lsG(k);
    if(!sess||!sess.exercises)continue;
    sess.exercises.forEach(e=>{if(e.name&&e.name.toLowerCase().includes(q))allNames.add(e.name);if(e.origName&&e.origName.toLowerCase().includes(q))allNames.add(e.origName);});
  }
  if(!allNames.size){el.innerHTML=`<div style="font-size:13px;color:var(--dim);padding:8px">No exercise found matching "${query}"</div>`;return;}
  // Detect inputType from exercise definition
  function getInputType(name){
    for(const d of DAYS){for(const e of d.ex){
      if(e.n===name)return e.inputType||'weight';
      if(e.inputType==='choice'&&e.choiceOptions){const o=e.choiceOptions.find(o=>o.name===name);if(o)return o.inputType;}
    }}return 'weight';
  }
  function getExDef(name,itype){
    for(const d of DAYS){for(const e of d.ex){
      if(e.n===name)return e;
      if(e.inputType==='choice'&&e.choiceOptions){const o=e.choiceOptions.find(o=>o.name===name);if(o)return{...e,...o};}
    }}
    return{inputType:itype,r:'8\u201312',compound:false,noweight:itype==='bodyweight'};
  }
  function fmtBest(best,itype){
    if(!best)return '—';
    if(itype==='bodyweight')return(best.r||0)+' reps';
    if(itype==='seconds')return best.w+'s';
    if(itype==='reps_each')return best.w+' each side';
    return best.w+'kg \u00d7 '+(best.r||0);
  }
  let html='';
  for(const name of allNames){
    const itype=getInputType(name);
    const hist=getExHistory(name);
    if(!hist.length)continue;
    const isRepsFirst=itype==='bodyweight';
    const chartPts=hist.filter(h=>h.best&&(isRepsFirst?h.best.r:h.best.w)).map(h=>({
      y:isRepsFirst?parseInt(h.best.r||0):parseFloat(h.best.w),
      label:h.date.slice(5),date:h.date,pr:h.isPR
    }));
    const chartLabel=itype==='bodyweight'?'Reps per session':itype==='seconds'?'Seconds held':itype==='reps_each'?'Reps per side':'Best weight (kg)';
    const chartUnit=itype==='bodyweight'?'reps':itype==='seconds'?'s':itype==='reps_each'?'/side':'kg';
    const lastBest=hist[hist.length-1]?.best;
    const liveSugg=lastBest?getSuggestion(getExDef(name,itype),lastBest,name):'';
    html+=`<div style="font-size:15px;font-weight:700;font-family:'Barlow',sans-serif;margin-bottom:10px;color:var(--txt)">${name}</div>
    ${chartPts.length>=2?`<div class="chart-wrap"><div class="chart-label">${chartLabel}</div>${buildSVG(chartPts,'var(--cyan)',chartUnit)}<div style="font-size:11px;color:var(--dim);margin-top:4px">&#x25CF; Yellow dots = personal records</div></div>`:''}
    <div style="margin-top:12px">
      ${hist.slice().reverse().map(h=>`<div class="hist-ex-row">
        <div class="hist-date">${h.date}</div>
        <div style="font-size:11px;color:var(--mut)">${h.dl}</div>
        <div class="hist-best">${fmtBest(h.best,itype)}${h.isPR?'<span class="hist-pr">&#x2605; PR</span>':''}</div>
      </div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--cyan);margin-top:10px;font-weight:600">${liveSugg}</div>
    <div class="sep"></div>`;
  }
  el.innerHTML=html||`<div style="font-size:13px;color:var(--dim);padding:8px">No data logged for "${query}" yet</div>`;
}

function runMigration(){
  const sv=lsG('schema_version')||1;
  if(sv<2){
    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i);
      if(k&&k.startsWith('pr:'))localStorage.removeItem(k);
    }
    lsS('schema_version',2);
  }
}
