.hdr{padding:18px 16px 10px;background:linear-gradient(150deg,var(--rbg2),var(--bg) 70%)}
.ht{font-size:21px;font-weight:800;letter-spacing:.3px;color:var(--plum)}
.ey{font-size:11px;color:var(--dim);margin-top:2px}
#hsub{font-size:12.5px;color:var(--mut);margin-top:4px;font-weight:600}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c1);border-top:1px solid var(--c3);z-index:50}
.tab{flex:1;padding:12px 0 14px;text-align:center;font-size:12px;font-weight:700;color:var(--dim);background:none;border:none;font-family:inherit}
.tab.on{color:var(--rose)}
.page{display:none;padding:12px 14px 20px}
.page.on{display:block}
.card{background:var(--c1);border:1px solid var(--c3);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(140,90,110,.06)}
.card.warm{background:var(--rbg2);border-color:#EFC9D8}
.cl{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}
.ct{font-size:16px;font-weight:800}
.cs{font-size:13px;color:var(--mut);line-height:1.5}
.btn{border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;color:#fff;background:var(--rose)}
.btn-plum{background:var(--plum)}
.btn-grn{background:var(--grn)}
.btn-ghost{background:var(--c2);color:var(--plum);border:1px solid var(--c3)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:10px}
.nt{border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.45}
.ng{background:var(--gbg);color:var(--grn)}.na{background:var(--abg);color:var(--amb)}.nr{background:var(--rbg);color:var(--red)}.np{background:var(--pbg);color:var(--plum)}
.macrow{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--c3)}
.macval{font-weight:700}
.sinput,select.sinput{width:100%;padding:11px;border:1px solid var(--c3);border-radius:11px;font-size:14px;background:var(--c1);color:var(--txt);font-family:inherit;margin-bottom:8px}
.sinput:focus{outline:none;border-color:var(--rose)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chip{display:inline-block;border:1.5px solid var(--c3);background:var(--c1);color:var(--mut);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;margin:0 6px 8px 0;font-family:inherit}
.chip.on{background:var(--rbg2);border-color:var(--rose);color:var(--rose)}
.big{font-size:30px;font-weight:800}
.kcal-ring{display:flex;align-items:center;gap:14px}
.wheel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wseg{flex:1;min-width:56px;text-align:center;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:700;background:var(--c2);color:var(--dim);border:1.5px solid var(--c3)}
.wseg.hit{background:var(--gbg);color:var(--grn);border-color:var(--grn)}
.pstat{text-align:center;flex:1}.pval{font-size:21px;font-weight:800}.plbl{font-size:10.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.hitem{padding:9px 0;border-bottom:1px solid var(--c2);font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.svgc{width:100%;height:130px;margin-top:6px}
#update-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:var(--abg);color:var(--amb);font-size:12.5px;font-weight:700;padding:9px 14px;text-align:center}
</style>
</head>

};
function foodGroups(f){
  if(FG_OVERRIDES[f.name])return FG_OVERRIDES[f.name];
  const n=f.name.toLowerCase();const g=[];
  if(/chicken|egg|fish|mutton|prawn|soya|paneer|dal|sambar|chickpea|rajma/.test(n))g.push('protein');
  if(/curd|yogurt|milk|paneer|boost/.test(n))g.push('dairy');
  if(/rice|idli|dosa|chapati|roti|bread|oats|millet|noodle|cereal|sandwich/.test(n))g.push('grain');
  if(/poriyal|veg|cabbage|carrot|beans|cucumber|greens|keerai|salad|brinjal|drumstick|kuzhambu|avial|kootu|tomato|onion/.test(n))g.push('veg');
  if(/banana|apple|fruit|watermelon|papaya|orange|berr|grape|pomegranate|mango|dates|fig|anjir/.test(n))g.push('fruit');
  if(/cashew|almond|nut|seed|peanut/.test(n))g.push('nuts');
  return g.length?g:['other'];
}

/* ===== MEAL-GAP COACH (deterministic, reads today only) ===== */
function coachAfterLog(){
  const t=dayTotals(),g=dayGroups(),hr=new Date().getHours(),veg=isVegDay();
  const remain=Math.round(T.kcal-t.k);
  const tips=[];
  if(remain<0)tips.push({c:'nr',m:'&#x26A0; '+Math.abs(remain)+' kcal over today\u2019s '+T.kcal+'. Keep the rest of today light \u2014 tomorrow is a fresh page.'});
  else if(remain<250&&hr<18)tips.push({c:'na',m:'Only '+remain+' kcal left with dinner to come \u2014 go veg-heavy and light tonight.'});
  if(hr>=15&&!g.veg)tips.push({c:'na',m:'No veg serving yet today \u2014 add a poriyal, salad or greens at dinner.'});
  if(hr>=15&&!g.fruit)tips.push({c:'np',m:'No fruit yet \u2014 a fruit bowl makes an easy evening snack.'});
  if(t.p<T.protein*0.4&&hr>=15)tips.push({c:'na',m:'Protein is behind ('+Math.round(t.p)+'g of '+T.protein+'g). '+(veg?'Veg day: paneer, curd bowl, dal or soya chunks tonight.':'Eggs, paneer, curd or chicken tonight.')});
  if(!tips.length)tips.push({c:'ng',m:'&#x2713; Nicely balanced so far \u2014 '+remain+' kcal remaining.'});
  return tips;
}

/* ===== CYCLE TRACKING ===== */
function cycleInfo(){
  const starts=lsG('cycle_starts')||[];
  if(!starts.length)return{msg:'',periodWeek:false};
  const last=new Date(starts[starts.length-1]);
  const day=Math.floor((new Date()-last)/86400000)+1;
  let msg='Cycle day '+day;
  let predicted=null;
  if(starts.length>=2){
    const gaps=[];for(let i=1;i<starts.length;i++)gaps.push((new Date(starts[i])-new Date(starts[i-1]))/86400000);
    const avg=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
    const next=new Date(last.getTime()+avg*86400000);
    const inDays=Math.round((next-new Date())/86400000);
    predicted=inDays;
    if(inDays>=0&&inDays<=4)msg+=' \u00b7 period expected in ~'+inDays+' day'+(inDays===1?'':'s');
    else msg+=' \u00b7 avg cycle '+avg+' days';
  }
  return{msg,periodWeek:day<=6,day,predicted};
}
function logPeriodStart(){
  const starts=lsG('cycle_starts')||[];
  if(starts[starts.length-1]===todayKey())return;
  starts.push(todayKey());lsS('cycle_starts',starts.slice(-24));
  renderTrends();renderToday();
}

function svgLine(data,color,unit,goal){
  if(data.length<2)return'<div class="cs">Log at least two entries to see the chart.</div>';
  const vals=data.map(d=>d.v);
  let min=Math.min(...vals,goal||Infinity),max=Math.max(...vals,goal||0);
  if(max-min<1){min-=0.5;max+=0.5;}
  const W=320,H=120,px=i=>10+(W-20)*i/(data.length-1),py=v=>H-12-(H-24)*(v-min)/(max-min);
  const pts=data.map((d,i)=>px(i)+','+py(d.v)).join(' ');
  const goalLine=goal?`<line x1="10" y1="${py(goal)}" x2="${W-10}" y2="${py(goal)}" stroke="var(--grn)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-10}" y="${py(goal)-4}" text-anchor="end" font-size="10" fill="var(--grn)">goal ${goal}${unit}</text>`:'';
  return`<svg class="svgc" viewBox="0 0 ${W} ${H}">${goalLine}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${data.map((d,i)=>`<circle cx="${px(i)}" cy="${py(d.v)}" r="3" fill="${color}"/>`).join('')}</svg>
  <div class="cs">latest: <b>${vals[vals.length-1]}${unit}</b> &middot; ${vals.length} entries</div>`;
}

}

  </div>`;
  html+=`<div class="card"><div class="cl">Measurements \u2014 1st of each month (cm)</div>
    <div class="row2"><input class="sinput" id="tm-w" type="number" placeholder="waist"><input class="sinput" id="tm-h" type="number" placeholder="hips"></div>
    <div class="row2"><input class="sinput" id="tm-t" type="number" placeholder="thigh"><input class="sinput" id="tm-a" type="number" placeholder="arm"></div>
    <button class="btn btn-sm" style="width:100%" onclick="logMeasure()">Log measurements</button>
    ${meas.length?`<div style="margin-top:8px">${meas.slice(-3).reverse().map(m=>`<div class="hitem"><span>${m.date}</span><span style="color:var(--mut);font-size:12.5px">${['waist','hips','thigh','arm'].filter(k=>m[k]).map(k=>k+' '+m[k]).join(' \u00b7 ')}</span></div>`).join('')}</div>`:''}
  </div>`;
  html+=`<div class="card"><div class="cl">Cycle</div>
    <div class="cs">${cyc.msg||'No cycle logged yet.'}</div>
    <button class="btn btn-plum btn-sm" style="width:100%;margin-top:8px" onclick="logPeriodStart()">Period started today</button>
    ${cyc.periodWeek?'<div class="nt np">Weight often rises 0.5\u20131kg this week from water \u2014 the chart knows, do not panic.</div>':''}
  </div>`;
  html+=weeklyCard();
  document.getElementById('p3').innerHTML=html;
}
/* ===== WEEKLY DIETICIAN CARD ===== */
function weeklyCard(){
  let days=0,kSum=0,covSum=0,pSum=0;
  for(let i=0;i<7;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const log=lsG('food:'+dateKeyOf(d));if(!log||!log.length)continue;
    days++;const t=log.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p}),{k:0,p:0});
    kSum+=t.k;pSum+=t.p;
    const hit={};log.forEach(e=>(e.groups||[]).forEach(g=>hit[g]=1));
    covSum+=GROUPS.filter(([id])=>hit[id]).length;
  }
  if(!days)return'';
  const avgK=Math.round(kSum/days),avgCov=(covSum/days).toFixed(1),avgP=Math.round(pSum/days);
  let sugg;
  if(avgK>T.kcal+120)sugg='Average is '+(avgK-T.kcal)+' kcal over target \u2014 the shake or dinner portion is the likeliest place to trim.';
  else if(avgCov<4)sugg='Food groups averaging '+avgCov+'/6 \u2014 most days miss veg or fruit. One salad or bowl daily fixes it.';
  else if(avgP<T.protein-15)sugg='Protein averaging '+avgP+'g \u2014 add a curd bowl or paneer portion daily to protect muscle while losing.';
  else sugg='Genuinely well balanced this week \u2014 keep exactly this up.';
  return`<div class="card warm"><div class="cl">This week \u2014 dietician card</div>
    <div style="display:flex;margin:8px 0">
      <div class="pstat"><div class="pval">${avgK}</div><div class="plbl">avg kcal</div></div>
      <div class="pstat"><div class="pval">${avgCov}/6</div><div class="plbl">food groups</div></div>
      <div class="pstat"><div class="pval">${avgP}g</div><div class="plbl">avg protein</div></div>
    </div>
    <div class="nt np">${sugg}</div>
  </div>`;
}
/* ===== YOU TAB ===== */
function exportData(){
  const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);data[k]=localStorage.getItem(k);}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sweta-fitness-'+todayKey()+'.json';a.click();
  URL.revokeObjectURL(a.href);lsS('last_export',todayKey());renderYou();
}
function shareBackup(){
  const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);data[k]=localStorage.getItem(k);}
  const file=new File([JSON.stringify(data)],'sweta-fitness-'+todayKey()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Sweta fitness backup'}).then(()=>{lsS('last_export',todayKey());renderYou();}).catch(()=>{});
  }else{exportData();}
}
function importData(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const data=JSON.parse(r.result);
    Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
    location.reload();
  }catch{alert('Could not read that backup file.');}};
  r.readAsText(f);
}
function checkUpdate(){
  if(!navigator.onLine)return;
  fetch(LIVE_URL,{cache:'no-store'}).then(r=>r.text()).then(txt=>{
    const m=txt.match(/Sweta Fitness (v[\d.]+[a-z]?)/);
    if(m&&m[1]!==APP_VERSION){
      const b=document.getElementById('update-banner');
      b.textContent=m[1]+' is live but this phone runs '+APP_VERSION+' \u2014 clear cached files (not site data), then reload.';
      b.style.display='block';
    }
  }).catch(()=>{});
}
function renderYou(){
  const lastExport=lsG('last_export');
  const expDays=lastExport?Math.floor((new Date()-new Date(lastExport))/86400000):null;
  const expCol=expDays===null?'var(--red)':expDays<=7?'var(--grn)':expDays<=14?'var(--amb)':'var(--red)';
  const expTxt=expDays===null?'&#x26A0; Never exported \u2014 data at risk':expDays===0?'&#x2713; Exported today':'Last export: '+expDays+'d ago';
  const stats=lsG('bstats')||[];const latest=stats.length?stats[stats.length-1].w:T.startW;
  let html=`<div class="card"><div class="cl">Your plan</div>
    <div class="macrow"><span>Goal</span><span class="macval">${T.goalW}kg, lean \u2014 from ${T.startW}kg</span></div>
    <div class="macrow"><span>Daily calories</span><span class="macval">${T.kcal} kcal (never below ${T.kcalFloor})</span></div>
    <div class="macrow"><span>Protein</span><span class="macval">${T.protein}g/day</span></div>
    <div class="macrow"><span>Veg days</span><span class="macval">Mon &middot; Thu &middot; Sat (no eggs)</span></div>
    <div class="macrow"><span>Rhythm</span><span class="macval">Move on alternate days</span></div>
    <div class="macrow"><span>Progress</span><span class="macval">${(T.startW-latest).toFixed(1)}kg of ${(T.startW-T.goalW).toFixed(1)}kg</span></div>
    <div class="cs" style="margin-top:8px">Slow is the plan: 0.25\u20130.4kg/week keeps the muscle. The app will tell you if it is going too fast.</div>
  </div>`;
  html+=`<div class="card"><div class="cl">Data backup</div>
    <div style="font-size:13px;color:${expCol};font-weight:700;margin-bottom:10px">${expTxt}</div>
    <button class="btn btn-grn btn-sm" style="width:100%;margin-bottom:8px" onclick="exportData()">Export all data (JSON)</button>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:8px" onclick="shareBackup()">Share backup (WhatsApp / Drive)</button>
    <button class="btn btn-ghost btn-sm" style="width:100%" onclick="document.getElementById('import-input').click()">Import from backup</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">
  </div>`;
  html+=`<div class="card"><div class="cl">About</div><div class="cs">Sweta Fitness ${APP_VERSION} \u00b7 shares its food engine with Roshan Fitness v2.2b. All data stays on this phone \u2014 export weekly.</div></div>`;
  document.getElementById('p4').innerHTML=html;
}

/* ===== TABS + INIT ===== */
function goTab(n){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.t===n));
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('on',i===n));
  [renderToday,renderFood,renderMove,renderTrends,renderYou][n]();
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>goTab(+b.dataset.t)));
document.addEventListener('input',e=>{if(e.target&&e.target.id==='sf-amt')swPreview();});
function checkStorage(){try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__');}catch{alert('Storage unavailable \u2014 data will not save. Check browser settings.');}}
checkStorage();
checkUpdate();
renderToday();renderFood();renderMove();renderTrends();renderYou();
</script>
